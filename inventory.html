<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Items - Tamenomics 2</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
body { font-family: 'Jersey 10', sans-serif; background: #fff; color: #000; margin: 0; padding: 0; }
header { background: #2c9118; color: #fff; padding: 25px 20px; text-align: center; }
header h1 { font-size: 2.5rem; margin: 0; cursor: pointer; }
nav { margin-top: 10px; }
nav a { color: #fff; text-decoration: none; margin: 0 10px; font-size: 1.1rem; font-weight: bold; }
nav a:hover { color: #000; }
main { max-width: 900px; margin: 30px auto; padding: 20px; text-align: center; }
h2 { color: #2c9118; font-size: 2rem; margin-bottom: 20px; }
section { margin-bottom: 40px; }
.items-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
.item-card { background: #f0f0f0; border: 2px solid #2c9118; border-radius: 10px; padding: 15px; min-width: 120px; text-align: center; position: relative; }
.item-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; }
.item-count { position: absolute; top: 5px; right: 10px; background: #2c9118; color: #fff; padding: 2px 6px; border-radius: 6px; font-size: 0.9rem; }
footer { text-align: center; padding: 20px; background: #000; color: #fff; margin-top: 30px; }
</style>
</head>
<body>

<header>
<h1 onclick="location.href='index.html'">Tamenomics 2</h1>
<nav>
  <a href="bank.html">Bank</a>
  <a href="jobs.html">Jobs</a>
  <a href="fishing.html">Fishing</a>
  <a href="hunting.html">Hunting</a>
  <a href="shop.html">Shop</a>
  <a href="items.html">Items</a>
  <a href="minigames.html">Mini-Games</a>
</nav>
</header>

<main>
<h2>Your Inventory</h2>

<!-- Fishing Items -->
<section>
<h3>Fishing Items</h3>
<div class="items-grid" id="fishing-items"></div>
</section>

<!-- Hunting Items -->
<section>
<h3>Hunting Items</h3>
<div class="items-grid" id="hunting-items"></div>
</section>

<!-- Shop Items -->
<section>
<h3>Shop Items</h3>
<div class="items-grid" id="shop-items"></div>
</section>

<!-- Pets -->
<section>
<h3>Pets</h3>
<div class="items-grid" id="pets-items"></div>
</section>

<!-- Skills -->
<section>
<h3>Skills</h3>
<div class="items-grid" id="skills-items"></div>
</section>

</main>

<footer>&copy; 2025 Arztiser</footer>

<script>
// Retrieve items from localStorage
let items = JSON.parse(localStorage.getItem('items')) || {};

// Categorize items
const categories = {
  "fishing-items": ["Fish","Pufferfish","Otter","Crab","Tropical Fish","Shark","Boot","Fishing Rod"],
  "hunting-items": ["Skunk","Boar","Bear","Deer","Armadillo","Duck","Dragon","Rifle","Bow and Arrow"],
  "shop-items": ["Bundle","Car","Laptop","Phone","TV","Name Tag"],
  "pets-items": ["Capybara","Cat","Chicken","Dog","Hamster","Parrot","Rabbit","Rock","Snake"],
  "skills-items": ["Affluence","Bargaining","Luring"]
};

// Populate cards
for (let category in categories) {
  const container = document.getElementById(category);
  categories[category].forEach(itemName => {
    if (items[itemName] && items[itemName] > 0) {
      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `<div class="item-name">${itemName}</div>`;
      if (items[itemName] > 1) {
        card.innerHTML += `<div class="item-count">x${items[itemName]}</div>`;
      }
      container.appendChild(card);
    }
  });
}
</script>

</body>
</html>
