<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2c9118" />
<meta name="description" content="View Your Caught Animals And Fish In Your Inventory." />
<title>Inventory - Tamenomics</title>
<link rel="icon" href="./img/pfp.png" />
<link rel="stylesheet" href="https://therandoms.pages.dev/css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Jersey 10', sans-serif;
    font-size: 30px;
    margin: 0; padding: 0;
    background: #f5f5f5;
    color: #2c9118;
    text-align: center;
  }
  header {
    background: #2c9118;
    color: white;
    padding: 15px 0;
  }
  main {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 6px 15px rgb(44 145 24 / 0.3);
  }
  ul {
    list-style: none;
    padding: 0;
    font-size: 28px;
  }
  li {
    margin: 10px 0;
  }
  nav {
    margin-top: 30px;
  }
  nav a {
    color: #2c9118;
    font-weight: 700;
    margin: 0 12px;
    text-decoration: none;
  }
  nav a:hover {
    text-decoration: underline;
  }
  .empty-msg {
    font-size: 28px;
    font-weight: 700;
    margin-top: 20px;
  }
</style>
</head>
<body>
<header>
  <h1>Inventory - Tamenomics</h1>
</header>
<main>
  <h2>Your Items</h2>
  <ul id="inventory-list"></ul>
  <div id="empty-msg" class="empty-msg" style="display:none;">Your Inventory Is Empty.</div>

  <nav>
    <a href="index.html">Home</a> |
    <a href="bank.html">Bank</a> |
    <a href="hunt.html">Hunt</a> |
    <a href="fish.html">Fish</a> |
    <a href="shop.html">Shop</a>
  </nav>
</main>

<script>
  const inventoryList = document.getElementById('inventory-list');
  const emptyMsg = document.getElementById('empty-msg');
  const inventory = JSON.parse(localStorage.getItem('inventory')) || {};

  function displayInventory() {
    inventoryList.innerHTML = '';
    const items = Object.entries(inventory);
    if (items.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    } else {
      emptyMsg.style.display = 'none';
    }
    items.forEach(([item, qty]) => {
      const li = document.createElement('li');
      li.textContent = `${item}: ${qty}`;
      inventoryList.appendChild(li);
    });
  }

  displayInventory();
</script>
</body>
</html>
