<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c9118" />
  <meta name="description" content="View your inventory - Tamenomics Discord Bot Economy" />
  <title>Inventory - Tamenomics</title>
  <link rel="icon" href="./img/pfp.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #2c9118;
    }
    header {
      background-color: #2c9118;
      padding: 12px 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }
    .menu-icon {
      font-size: 30px;
      cursor: pointer;
      user-select: none;
    }
    .topnav-right {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      background-color: #2c9118;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      z-index: 999;
      overflow-y: auto;
    }
    .topnav.active .topnav-right {
      display: flex;
    }
    body.menu-open {
      overflow: hidden;
    }
    .accordion-toggle {
      background: none;
      color: white;
      padding: 14px;
      text-align: left;
      font-size: 24px;
      border: none;
      outline: none;
      cursor: pointer;
      width: 100%;
      font-family: 'Jersey 10', sans-serif;
      user-select: none;
    }
    .accordion-content {
      display: none;
      flex-direction: column;
      background-color: #1e6f12;
    }
    .accordion-content a {
      padding: 12px 28px;
      border-top: 1px solid #146f0e;
      font-size: 20px;
      color: white;
      text-decoration: none;
      user-select: none;
    }
    .accordion-content a:hover {
      background: #146f0e;
    }
    .accordion-section {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #1e6f12;
    }
    .accordion-section.open .accordion-content {
      display: flex;
    }
    main {
      max-width: 600px;
      margin: 24px auto;
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 10px rgba(44, 145, 24, 0.3);
    }
    h2 {
      font-weight: 700;
      font-size: 32px;
      margin-bottom: 20px;
      color: #2c9118;
      user-select: none;
      text-align: center;
    }
    .section-title {
      font-weight: 600;
      font-size: 24px;
      margin-top: 20px;
      border-bottom: 2px solid #2c9118;
      padding-bottom: 6px;
      user-select: none;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
      user-select: none;
    }
    li {
      font-size: 20px;
      padding: 6px 10px;
      border-bottom: 1px solid #ccc;
    }
    .empty-msg {
      font-size: 18px;
      color: #666;
      margin-top: 8px;
      user-select: none;
    }
    @media (max-width: 640px) {
      main {
        margin: 16px 10px;
        padding: 16px;
      }
      h2 {
        font-size: 26px;
      }
      .section-title {
        font-size: 20px;
      }
      li {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 onclick="location.href='/'">Tamenomics</h1>
    <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
    <nav class="topnav-right">
      <div class="accordion-section">
        <button class="accordion-toggle">Actions</button>
        <div class="accordion-content">
          <a href="hunt.html">Hunt</a>
          <a href="fish.html">Fish</a>
          <a href="crime.html">Crime</a>
          <a href="search.html">Search</a>
        </div>
      </div>
      <div class="accordion-section">
        <button class="accordion-toggle">Economy</button>
        <div class="accordion-content">
          <a href="bank.html">Bank</a>
          <a href="casino.html">Casino</a>
          <a href="jobs.html">Jobs</a>
          <a href="shop.html">Shop</a>
          <a href="sell.html">Sell</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <h2>Your Inventory</h2>

    <div class="section-title">Animals & Fish</div>
    <ul id="animals-list">
      <!-- Animal inventory items go here -->
    </ul>
    <div id="animals-empty" class="empty-msg">You have no animals or fish yet.</div>

    <div class="section-title">Items</div>
    <ul id="items-list">
      <!-- Items inventory goes here -->
    </ul>
    <div id="items-empty" class="empty-msg">You have no items yet.</div>
  </main>

  <script>
    // Demo inventory data (replace with real data integration)
    const inventory = {
      animals: {
        Deer: 3,
        Rabbit: 5,
        Salmon: 2,
      },
      items: {
        Rifle: 1,
        'Fishing Rod': 1,
      },
    };

    const animalsList = document.getElementById('animals-list');
    const itemsList = document.getElementById('items-list');
    const animalsEmpty = document.getElementById('animals-empty');
    const itemsEmpty = document.getElementById('items-empty');

    function populateList(listEl, dataObj, emptyEl) {
      listEl.innerHTML = '';
      const keys = Object.keys(dataObj);
      if (keys.length === 0) {
        emptyEl.style.display = 'block';
        listEl.style.display = 'none';
        return;
      }
      emptyEl.style.display = 'none';
      listEl.style.display = 'block';
      keys.forEach(key => {
        const li = document.createElement('li');
        li.textContent = `${key} x${dataObj[key]}`;
        listEl.appendChild(li);
      });
    }

    populateList(animalsList, inventory.animals, animalsEmpty);
    populateList(itemsList, inventory.items, itemsEmpty);

    function toggleMenu() {
      document.querySelector('header').classList.toggle('active');
      document.querySelector('.topnav-right').classList.toggle('active');
      document.body.classList.toggle('menu-open');
    }

    document.querySelectorAll('.accordion-toggle').forEach(btn =>
      btn.addEventListener('click', () => {
        const section = btn.parentElement;
        document.querySelectorAll('.accordion-section').forEach(s => {
          if (s !== section) s.classList.remove('open');
        });
        section.classList.toggle('open');
      })
    );
  </script>
</body>
</html>
