<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishing - Tamenomics 2</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
body { font-family: 'Jersey 10', sans-serif; background: #fff; color: #000; margin: 0; padding: 0; }
header { background: #2c9118; color: #fff; padding: 25px 20px; text-align: center; }
header h1 { font-size: 2.5rem; margin: 0; cursor: pointer; }
nav { margin-top: 10px; }
nav a { color: #fff; text-decoration: none; margin: 0 10px; font-weight: bold; font-size: 1.1rem; }
nav a:hover { color: #000; }
main { max-width: 700px; margin: 30px auto; background: #fff; border-radius: 12px; box-shadow: 0 0 15px rgba(44,145,24,0.3); padding: 30px 25px; text-align: center; }
h2 { color: #2c9118; margin-bottom: 25px; font-size: 2rem; }
label { display: block; margin-top: 15px; font-weight: bold; font-size: 1rem; color: #2c9118; }
select, button { width: 90%; padding: 12px; font-family: 'Jersey 10', sans-serif; font-size: 1rem; margin: 10px 0; border-radius: 8px; border: 2px solid #2c9118; }
button { background: #2c9118; color: #fff; border: none; cursor: pointer; font-weight: bold; transition: background 0.3s; }
button:hover { background: #1f6d13; }
button:disabled { background: #aaa; cursor: not-allowed; }
.stats-container { display: flex; justify-content: center; flex-wrap: wrap; margin-top: 35px; }
.stat-card { background: #000; color: #fff; padding: 20px; border-radius: 12px; min-width: 200px; margin: 10px; }
.stat-card p { color: #2c9118; font-size: 1.5rem; font-weight: bold; margin: 5px 0 0; word-wrap: break-word; }
footer { text-align: center; padding: 20px; background: #000; color: #fff; margin-top: 30px; }
</style>
</head>
<body>

<header>
<h1 onclick="location.href='index.html'">Tamenomics 2</h1>
<nav>
  <a href="bank.html">Bank</a>
  <a href="jobs.html">Jobs</a>
  <a href="fishing.html">Fishing</a>
  <a href="hunting.html">Hunting</a>
  <a href="shop.html">Shop</a>
  <a href="items.html">Items</a>
  <a href="minigames.html">Mini-Games</a>
</nav>
</header>

<main>
<h2>Fishing</h2>

<label for="location-select">Choose a Fishing Location:</label>
<select id="location-select">
  <option value="" disabled selected>Select Location</option>
  <option value="river">River</option>
  <option value="lake">Lake</option>
  <option value="ocean">Ocean</option>
</select>

<button id="fish-btn">Go Fishing!</button>

<div class="stats-container">
  <div class="stat-card">
    <h3>Fish Caught</h3>
    <p id="fish-stat">None</p>
  </div>
</div>
</main>

<footer>&copy; 2025 Arztiser</footer>

<script>
// Initialize state
let items = JSON.parse(localStorage.getItem('items')) || [];
const fishStat = document.getElementById('fish-stat');
const locationSelect = document.getElementById('location-select');
const fishBtn = document.getElementById('fish-btn');

// Example fish by rarity/location
const fishData = {
  river: [
    {name: "Small Trout", value: 5, chance: 0.6},
    {name: "Large Trout", value: 15, chance: 0.3},
    {name: "Golden Trout", value: 50, chance: 0.1}
  ],
  lake: [
    {name: "Carp", value: 5, chance: 0.5},
    {name: "Bass", value: 20, chance: 0.35},
    {name: "Legendary Bass", value: 60, chance: 0.15}
  ],
  ocean: [
    {name: "Mackerel", value: 10, chance: 0.55},
    {name: "Tuna", value: 30, chance: 0.35},
    {name: "Shark", value: 80, chance: 0.1}
  ]
};

function updateFishStat() {
  fishStat.textContent = items.length ? items.join(', ') : 'None';
  localStorage.setItem('items', JSON.stringify(items));
}

function catchFish(location) {
  const possibleFish = fishData[location];
  let roll = Math.random();
  let cumulative = 0;
  for(let fish of possibleFish) {
    cumulative += fish.chance;
    if(roll <= cumulative) return fish;
  }
  return possibleFish[0]; // fallback
}

fishBtn.addEventListener('click', () => {
  const location = locationSelect.value;
  if(!location) { alert("Please select a location first!"); return; }

  // Check if user has a fishing rod
  const hasRod = items.includes("Fishing Rod");

  let caught;
  if(!hasRod) {
    const junkItems = ["Mud", "Rock", "Boot"];
    caught = junkItems[Math.floor(Math.random() * junkItems.length)];
    alert(`You don't have a fishing rod and caught ${caught}.`);
  } else {
    const fish = catchFish(location);
    caught = fish.name;
    alert(`You caught a ${caught} worth ${fish.value} Z!`);
  }

  items.push(caught);
  updateFishStat();
});

updateFishStat();
</script>

</body>
</html>
