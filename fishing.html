<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fishing - Tamenomics</title>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <style>
        body {
            background: white;
            font-family: "Jersey 10", sans-serif;
            padding: 20px;
            color: black;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid black;
            border-radius: 16px;
            padding: 20px;
            max-width: 450px;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #2c9118;
            font-size: 40px;
        }

        button {
            font-family: "Jersey 10", sans-serif;
            font-size: 24px;
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid black;
            background: #2c9118;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        .cooldown {
            margin-top: 10px;
            font-size: 20px;
            color: black;
        }
    </style>
</head>
<body>

    <h1>Fishing</h1>

    <div class="card">
        <p>You can fish once every hour.</p>
        <button id="fishBtn" onclick="fishNow()">Fish</button>
        <p id="cooldown" class="cooldown"></p>
    </div>

    <script>
        // --- Load inventory or create new ---
        function getInventory() {
            return JSON.parse(localStorage.getItem("inventory")) || {
                fishing: {},
                hunting: {},
                shop: {}
            };
        }

        function saveInventory(inv) {
            localStorage.setItem("inventory", JSON.stringify(inv));
        }

        // --- Cooldown System ---
        function canFish() {
            let last = parseInt(localStorage.getItem("lastFishTime")) || 0;
            return (Date.now() - last) >= 3600000;
        }

        function updateCooldownText() {
            const cooldown = document.getElementById("cooldown");
            const btn = document.getElementById("fishBtn");
            let last = parseInt(localStorage.getItem("lastFishTime")) || 0;

            let remaining = 3600000 - (Date.now() - last);

            if (remaining <= 0) {
                cooldown.textContent = "You can fish now.";
                btn.disabled = false;
                return;
            }

            let minutes = Math.floor(remaining / 60000);
            let seconds = Math.floor((remaining % 60000) / 1000);

            cooldown.textContent = `Next cast in ${minutes}m ${seconds}s`;
            btn.disabled = true;

            requestAnimationFrame(updateCooldownText);
        }

        // --- Fishing Logic ---
        function fishNow() {
            if (!canFish()) {
                alert("You can only fish once every hour!");
                return;
            }

            localStorage.setItem("lastFishTime", Date.now());
            updateCooldownText();

            let inv = getInventory();
            let hasRod = inv.shop["Fishing Rod"] >= 1;

            let pool = hasRod
                ? ["Bass", "Catfish", "Sunfish", "Salmon"]
                : ["Mud", "Rock", "Boot"];

            let item = pool[Math.floor(Math.random() * pool.length)];

            inv.fishing[item] = (inv.fishing[item] || 0) + 1;

            saveInventory(inv);

            alert("You caught: " + item);
        }

        updateCooldownText();
    </script>

</body>
</html>
