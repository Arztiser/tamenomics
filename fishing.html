<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishing - Tamenomics 2</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
body { font-family: 'Jersey 10', sans-serif; background: #fff; color: #000; margin: 0; padding: 0; }
header { background: #2c9118; color: #fff; padding: 25px 20px; text-align: center; }
header h1 { font-size: 2.5rem; margin: 0; cursor: pointer; }
nav { margin-top: 10px; }
nav a { color: #fff; text-decoration: none; margin: 0 10px; font-size: 1.1rem; font-weight: bold; }
nav a:hover { color: #000; }
main { max-width: 700px; margin: 30px auto; background: #fff; border-radius: 12px; box-shadow: 0 0 15px rgba(44,145,24,0.3); padding: 30px; text-align: center; }
h2 { color: #2c9118; font-size: 2rem; margin-bottom: 20px; }
select, button { width: 90%; padding: 12px; font-family: 'Jersey 10', sans-serif; margin: 12px 0; border: 2px solid #2c9118; border-radius: 8px; font-size: 1.1rem; }
button { background: #2c9118; color: #fff; cursor: pointer; }
button:hover { background: #1f6d13; }
button:disabled { background: #aaa; cursor: not-allowed; }
footer { text-align: center; padding: 20px; background: #000; color: #fff; margin-top: 30px; }
.cooldown-text { margin-top: 10px; color: #000; font-size: 1.2rem; }
</style>
</head>
<body>

<header>
<h1 onclick="location.href='index.html'">Tamenomics 2</h1>
<nav>
  <a href="bank.html">Bank</a>
  <a href="jobs.html">Jobs</a>
  <a href="fishing.html">Fishing</a>
  <a href="hunting.html">Hunting</a>
  <a href="shop.html">Shop</a>
  <a href="items.html">Items</a>
  <a href="minigames.html">Mini-Games</a>
</nav>
</header>

<main>
<h2>Fishing</h2>

<select id="location-select">
  <option value="" disabled selected>Select Fishing Location</option>
  <option value="river">River</option>
  <option value="lake">Lake</option>
  <option value="ocean">Ocean</option>
</select>

<button id="fish-btn">Go Fishing!</button>
<p id="cooldown-display" class="cooldown-text"></p>

</main>

<footer>&copy; 2025 Arztiser</footer>

<script>
let items = JSON.parse(localStorage.getItem('items')) || {};
function saveItems() { localStorage.setItem('items', JSON.stringify(items)); }
function addItem(itemName) { if (!items[itemName]) items[itemName] = 0; items[itemName]++; saveItems(); }

// Fish table for each location
const fishData = {
  river: [
    {name:"Fish", chance:0.4},
    {name:"Pufferfish", chance:0.2},
    {name:"Otter", chance:0.1},
    {name:"Crab", chance:0.15},
    {name:"Tropical Fish", chance:0.1},
    {name:"Shark", chance:0.05}
  ],
  lake: [
    {name:"Fish", chance:0.35},
    {name:"Pufferfish", chance:0.15},
    {name:"Otter", chance:0.15},
    {name:"Crab", chance:0.15},
    {name:"Tropical Fish", chance:0.15},
    {name:"Shark", chance:0.05}
  ],
  ocean: [
    {name:"Fish", chance:0.2},
    {name:"Pufferfish", chance:0.1},
    {name:"Otter", chance:0.05},
    {name:"Crab", chance:0.2},
    {name:"Tropical Fish", chance:0.2},
    {name:"Shark", chance:0.25}
  ]
};

function catchFish(location) {
  const table = fishData[location];
  let roll = Math.random();
  let cumulative = 0;
  for (let fish of table) {
    cumulative += fish.chance;
    if (roll <= cumulative) return fish.name;
  }
  return "Fish"; // fallback
}

// ---- COOLDOWN SYSTEM ----
const COOLDOWN_TIME = 3600000; // 1 hour
const cooldownDisplay = document.getElementById("cooldown-display");
const fishBtn = document.getElementById("fish-btn");

function checkCooldown() {
  const lastFish = parseInt(localStorage.getItem("lastFish")) || 0;
  const now = Date.now();
  const remaining = COOLDOWN_TIME - (now - lastFish);

  if (remaining <= 0) {
    fishBtn.disabled = false;
    cooldownDisplay.textContent = "You can fish now.";
    return;
  }

  fishBtn.disabled = true;
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  cooldownDisplay.textContent = `Next cast in ${mins}m ${secs}s`;
  requestAnimationFrame(checkCooldown);
}

checkCooldown();

// ---- FISH BUTTON ----
fishBtn.addEventListener('click', () => {
  const location = document.getElementById('location-select').value;
  if (!location) return alert("Select a location first!");

  if (!items["Fishing Rod"] || items["Fishing Rod"] <= 0) {
    const junk = ["Mud","Rock","Boot"];
    const caught = junk[Math.floor(Math.random()*junk.length)];
    addItem(caught);
    alert(`No fishing rod! You caught ${caught}.`);
  } else {
    const caught = catchFish(location);
    addItem(caught);
    alert(`You caught: ${caught}!`);
  }

  // start cooldown
  localStorage.setItem("lastFish", Date.now());
  checkCooldown();
});
</script>

</body>
</html>
