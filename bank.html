<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank - Tamenomics 2</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
body { font-family: 'Jersey 10', sans-serif; background:#fff; color:#000; margin:0; padding:0; }
header { background:#2c9118; color:#fff; padding:25px 20px; text-align:center; }
header h1 { font-size:2.5rem; margin:0; cursor:pointer; }
nav { margin-top:10px; }
nav a { color:#fff; text-decoration:none; margin:0 10px; font-weight:bold; font-size:1.1rem; }
nav a:hover { color:#000; }
main { max-width:600px; margin:30px auto; background:#fff; border-radius:12px; box-shadow:0 0 15px rgba(44,145,24,0.3); padding:30px; text-align:center; }
h2 { color:#2c9118; margin-bottom:25px; font-size:2rem; }
.balance-card { background:#000; color:#fff; padding:25px; border-radius:12px; margin:20px 0; font-size:1.5rem; }
footer { text-align:center; padding:20px; background:#000; color:#fff; margin-top:30px; }
</style>
</head>
<body>

<header>
<h1 onclick="location.href='index.html'">Tamenomics 2</h1>
<nav>
  <a href="bank.html">Bank</a>
  <a href="jobs.html">Jobs</a>
  <a href="fishing.html">Fishing</a>
  <a href="hunting.html">Hunting</a>
  <a href="shop.html">Shop</a>
  <a href="items.html">Items</a>
  <a href="minigames.html">Mini-Games</a>
</nav>
</header>

<main>
<h2>Bank</h2>
<div class="balance-card">
  Balance: <span id="balance-display">0</span> Zenas
</div>
<p style="font-size:1rem; color:#000;">This balance updates automatically whenever you earn or spend Zenas on any page.</p>
</main>

<footer>&copy; 2025 Arztiser</footer>

<script>
// Use 'bank' as the global economy key
if (!localStorage.getItem('bank')) {
    const startingBalance = Math.floor(Math.random() * 501) + 500; // 500–1000 Zenas
    localStorage.setItem('bank', startingBalance);
}

const balanceEl = document.getElementById('balance-display');

function updateBalanceDisplay() {
    balanceEl.textContent = localStorage.getItem('bank');
}

// Live update so changes on other pages reflect immediately
function liveUpdate() {
    updateBalanceDisplay();
    requestAnimationFrame(liveUpdate);
}

liveUpdate();

// Functions for modifying bank balance globally
function addZenas(amount) {
    let bank = parseInt(localStorage.getItem('bank')) || 0;
    bank += amount;
    localStorage.setItem('bank', bank);
}

function subtractZenas(amount) {
    let bank = parseInt(localStorage.getItem('bank')) || 0;
    bank -= amount;
    if (bank < 0) bank = 0;
    localStorage.setItem('bank', bank);
}

// Example usage:
// addZenas(50);   // Earn Zenas
// subtractZenas(25); // Spend Zenas
</script>

</body>
</html>
