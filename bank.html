<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2c9118" />
<meta name="description" content="Manage Your Bank Account In Tamenomics." />
<title>Bank - Tamenomics</title>
<link rel="icon" href="./img/pfp.png" />
<link rel="stylesheet" href="https://therandoms.pages.dev/css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Jersey 10', sans-serif;
    font-size: 30px;
    margin: 0; padding: 0;
    background: #f5f5f5;
    color: #2c9118;
    text-align: center;
  }
  header {
    background: #2c9118;
    color: white;
    padding: 15px 0;
  }
  main {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 6px 15px rgb(44 145 24 / 0.3);
  }
  input[type="number"] {
    font-family: 'Jersey 10', sans-serif;
    font-size: 26px;
    padding: 10px;
    width: 200px;
    border-radius: 8px;
    border: 2px solid #2c9118;
    margin-bottom: 20px;
  }
  button {
    font-family: 'Jersey 10', sans-serif;
    font-size: 24px;
    background: #2c9118;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 30px;
    margin: 10px;
    cursor: pointer;
    font-weight: 700;
    transition: background-color 0.3s;
  }
  button:hover {
    background: #237b14;
  }
  .balance {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 30px;
  }
  nav a {
    color: #2c9118;
    font-weight: 700;
    margin: 0 12px;
    text-decoration: none;
  }
  nav a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<header>
  <h1>Bank - Tamenomics</h1>
</header>
<main>
  <div class="balance" id="balance-display">Balance: $0</div>
  <input type="number" id="amount" placeholder="Enter Amount" min="1" />
  <br />
  <button id="deposit-btn">Deposit</button>
  <button id="withdraw-btn">Withdraw</button>
  <div id="message" style="color: red; margin-top: 15px; font-weight: 700;"></div>
  <nav>
    <a href="index.html">Home</a> | 
    <a href="hunt.html">Hunt</a> | 
    <a href="fish.html">Fish</a> | 
    <a href="inventory.html">Inventory</a> | 
    <a href="shop.html">Shop</a>
  </nav>
</main>

<script>
  const balanceDisplay = document.getElementById('balance-display');
  const amountInput = document.getElementById('amount');
  const depositBtn = document.getElementById('deposit-btn');
  const withdrawBtn = document.getElementById('withdraw-btn');
  const messageDiv = document.getElementById('message');

  // Initialize balance in localStorage
  if (!localStorage.getItem('balance')) {
    localStorage.setItem('balance', '0');
  }

  function updateBalanceDisplay() {
    const bal = Number(localStorage.getItem('balance'));
    balanceDisplay.textContent = `Balance: $${bal.toFixed(2)}`;
  }

  function clearMessage() {
    messageDiv.textContent = '';
  }

  depositBtn.addEventListener('click', () => {
    clearMessage();
    const amt = Number(amountInput.value);
    if (!amt || amt <= 0) {
      messageDiv.textContent = 'Enter A Valid Positive Amount!';
      return;
    }
    // For demo, assume user has unlimited cash (can expand later)
    let bal = Number(localStorage.getItem('balance'));
    bal += amt;
    localStorage.setItem('balance', bal.toString());
    updateBalanceDisplay();
    amountInput.value = '';
  });

  withdrawBtn.addEventListener('click', () => {
    clearMessage();
    const amt = Number(amountInput.value);
    if (!amt || amt <= 0) {
      messageDiv.textContent = 'Enter A Valid Positive Amount!';
      return;
    }
    let bal = Number(localStorage.getItem('balance'));
    if (amt > bal) {
      messageDiv.textContent = 'Cannot Withdraw More Than Balance!';
      return;
    }
    bal -= amt;
    localStorage.setItem('balance', bal.toString());
    updateBalanceDisplay();
    amountInput.value = '';
  });

  updateBalanceDisplay();
</script>
</body>
</html>
