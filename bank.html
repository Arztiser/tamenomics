<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c9118" />
  <meta name="description" content="Tamenomics Bank - Manage your cash and bank balances." />
  <title>Bank - Tamenomics</title>
  <link rel="icon" href="./img/pfp.png" />
  <link rel="stylesheet" href="https://therandoms.pages.dev/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      font-size: 30px;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #2c9118;
    }
    .container {
      margin: 20px auto;
      max-width: 600px;
      background: white;
      border-radius: 10px;
      padding: 30px 40px;
      box-shadow: 0 6px 15px rgb(44 145 24 / 0.3);
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: #2c9118;
    }
    .balances {
      display: flex;
      justify-content: space-around;
      margin-bottom: 40px;
      font-weight: 700;
      font-size: 24px;
    }
    .balances div {
      background: #daf1da;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: inset 0 0 10px #b7d5b7;
      min-width: 180px;
    }
    input[type="number"] {
      width: 100%;
      font-family: 'Jersey 10', sans-serif;
      font-size: 24px;
      padding: 14px 15px;
      border: 2px solid #2c9118;
      border-radius: 8px;
      margin-bottom: 30px;
      box-sizing: border-box;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }
    button {
      flex: 1;
      background-color: #2c9118;
      border: none;
      color: white;
      padding: 15px 0;
      font-family: 'Jersey 10', sans-serif;
      font-size: 24px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
      user-select: none;
    }
    button:disabled {
      background-color: #88b088;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #237b14;
    }
    .message {
      margin-top: 25px;
      font-weight: 700;
      font-size: 20px;
      height: 24px;
      color: #2c9118;
    }
    .topnav {
      overflow: hidden;
      background-color: #2c9118;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 60px;
      color: white;
    }
    .topnav h1 {
      margin: 0;
      font-size: 24px;
      color: white;
    }
    .topnav .menu-icon {
      display: block;
      font-size: 30px;
      color: white;
      cursor: pointer;
      margin-left: auto;
    }
    .topnav-right {
      display: none;
      position: fixed;
      top: 60px;
      right: 0;
      background-color: #2c9118;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      justify-content: flex-start;
      z-index: 999;
      overflow-y: auto;
    }
    .topnav.active .topnav-right {
      display: flex;
    }
    body.menu-open {
      overflow: hidden;
    }
    .accordion-toggle {
      background: none;
      color: white;
      padding: 14px;
      text-align: left;
      font-size: 24px;
      border: none;
      outline: none;
      cursor: pointer;
      width: 100%;
      font-family: 'Jersey 10', sans-serif;
    }
    .accordion-content {
      display: none;
      flex-direction: column;
      background-color: #1f6e0f;
    }
    .accordion-content a {
      padding-left: 28px;
      padding-top: 10px;
      padding-bottom: 10px;
      border-top: 1px solid #174b0a;
      font-size: 20px;
      color: white;
      text-decoration: none;
    }
    .accordion-section {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #1a590c;
    }
    .accordion-section.open .accordion-content {
      display: flex;
    }
    .topnav a:hover {
      background-color: #a2d38f;
      color: black;
    }
    .topnav a.active {
      background-color: #1a590c;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <div class="topnav">
      <h1>Tamenomics</h1>
      <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
      <div class="topnav-right">
        <div class="accordion-section">
          <button class="accordion-toggle">Tamenomics</button>
          <div class="accordion-content">
            <a href="bank.html" class="active">Bank</a>
            <a href="casino.html">Casino</a>
            <a href="shop.html">Shop</a>
            <a href="inventory.html">Inventory</a>
            <a href="hunt.html">Hunt</a>
            <a href="fish.html">Fish</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Bank</h1>
    <div class="balances">
      <div>Cash: $<span id="cash-balance">0</span></div>
      <div>Bank: $<span id="bank-balance">0</span></div>
    </div>
    <input type="number" id="amount" placeholder="Enter Amount" min="1" />
    <div class="btn-group">
      <button id="deposit-btn" onclick="deposit()">Deposit</button>
      <button id="withdraw-btn" onclick="withdraw()">Withdraw</button>
    </div>
    <div class="message" id="message"></div>
  </main>

  <script>
    function toggleMenu() {
      const topnav = document.querySelector('.topnav');
      const body = document.body;
      topnav.classList.toggle('active');
      body.classList.toggle('menu-open');
    }

    document.querySelectorAll('.accordion-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const parent = toggle.parentElement;
        document.querySelectorAll('.accordion-section').forEach(section => {
          if (section !== parent) {
            section.classList.remove('open');
          }
        });
        parent.classList.toggle('open');
      });
    });

    let cashBalance = 0;
    let bankBalance = 0;

    const cashEl = document.getElementById('cash-balance');
    const bankEl = document.getElementById('bank-balance');
    const messageEl = document.getElementById('message');
    const amountInput = document.getElementById('amount');
    const depositBtn = document.getElementById('deposit-btn');
    const withdrawBtn = document.getElementById('withdraw-btn');

    function updateBalances() {
      cashEl.textContent = cashBalance;
      bankEl.textContent = bankBalance;
      messageEl.textContent = '';
      checkButtons();
    }

    function showMessage(text, isError = false) {
      messageEl.style.color = isError ? 'crimson' : '#2c9118';
      messageEl.textContent = text;
      setTimeout(() => {
        messageEl.textContent = '';
      }, 3500);
    }

    function checkButtons() {
      const amount = Number(amountInput.value);
      depositBtn.disabled = !amount || amount < 1 || amount > cashBalance;
      withdrawBtn.disabled = !amount || amount < 1 || amount > bankBalance;
    }

    amountInput.addEventListener('input', checkButtons);

    function deposit() {
      const amount = Number(amountInput.value);
      if (amount < 1 || amount > cashBalance) {
        showMessage("Invalid deposit amount.", true);
        return;
      }
      cashBalance -= amount;
      bankBalance += amount;
      updateBalances();
      amountInput.value = '';
      showMessage(`Successfully deposited $${amount}.`);
    }

    function withdraw() {
      const amount = Number(amountInput.value);
      if (amount < 1 || amount > bankBalance) {
        showMessage("Invalid withdrawal amount.", true);
        return;
      }
      bankBalance -= amount;
      cashBalance += amount;
      updateBalances();
      amountInput.value = '';
      showMessage(`Successfully withdrew $${amount}.`);
    }

    updateBalances();
  </script>
</body>
</html>
