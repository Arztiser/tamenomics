<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank - Tamenomics 2</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Jersey 10', sans-serif;
    background-color: #fff;
    color: #000;
    margin: 0;
    padding: 0;
  }
  header {
    background-color: #2c9118;
    color: white;
    padding: 25px 20px;
    text-align: center;
  }
  header h1 { font-size: 2.5rem; margin: 0; cursor: pointer; }
  nav {
    margin-top: 10px;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
    font-size: 1.1rem;
  }
  nav a:hover { color: #000; }
  main {
    max-width: 600px;
    margin: 30px auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(44,145,24,0.3);
    padding: 25px;
    text-align: center;
  }
  h2 { color: #2c9118; margin-bottom: 20px; }
  .balance { font-size: 1.2rem; margin: 10px 0; }
  input[type="number"] {
    padding: 10px;
    width: 60%;
    margin: 10px 0;
    border-radius: 8px;
    border: 2px solid #2c9118;
    font-family: 'Jersey 10', sans-serif;
    font-size: 1rem;
  }
  button {
    padding: 12px 20px;
    margin: 10px 0;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background-color: #2c9118;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
  }
  button:hover { background-color: #1f6d13; }
  .stats-container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    margin-top: 30px;
  }
  .stat-card {
    background-color: #000;
    color: #fff;
    padding: 20px;
    border-radius: 12px;
    min-width: 150px;
    margin: 10px;
  }
  .stat-card p { color: #2c9118; font-size: 1.5rem; font-weight: bold; margin: 5px 0 0; }
  footer { text-align: center; padding: 20px; background-color: #000; color: #fff; margin-top: 30px; }
</style>
</head>
<body>

<header>
  <h1 onclick="location.href='index.html'">Tamenomics 2</h1>
  <nav>
    <a href="bank.html">Bank</a>
    <a href="jobs.html">Jobs</a>
    <a href="fishing.html">Fishing</a>
    <a href="hunting.html">Hunting</a>
    <a href="shop.html">Shop</a>
    <a href="items.html">Items</a>
    <a href="minigames.html">Mini-Games</a>
  </nav>
</header>

<main>
  <h2>Bank</h2>
  <div class="balance">Cash: <span id="cash">0</span> Zenas</div>
  <div class="balance">Bank: <span id="bank">0</span> Zenas</div>

  <input type="number" id="deposit-amount" placeholder="Deposit Amount">
  <button id="deposit-btn">Deposit</button>

  <input type="number" id="withdraw-amount" placeholder="Withdraw Amount">
  <button id="withdraw-btn">Withdraw</button>

  <div class="stats-container">
    <div class="stat-card">
      <h3>Balance</h3>
      <p id="balance-stat">0 Z</p>
    </div>
    <div class="stat-card">
      <h3>Items</h3>
      <p id="items-stat">None</p>
    </div>
    <div class="stat-card">
      <h3>Jobs</h3>
      <p id="jobs-stat">None</p>
    </div>
  </div>
</main>

<footer>&copy; 2025 Arztiser</footer>

<script>
  let cash = 0;
  let bank = 0;
  let items = [];
  let jobs = [];

  const cashEl = document.getElementById('cash');
  const bankEl = document.getElementById('bank');
  const balanceStat = document.getElementById('balance-stat');
  const itemsStat = document.getElementById('items-stat');
  const jobsStat = document.getElementById('jobs-stat');

  const depositBtn = document.getElementById('deposit-btn');
  const withdrawBtn = document.getElementById('withdraw-btn');
  const depositInput = document.getElementById('deposit-amount');
  const withdrawInput = document.getElementById('withdraw-amount');

  function updateStats() {
    cashEl.textContent = cash;
    bankEl.textContent = bank;
    balanceStat.textContent = (cash + bank) + ' Z';
    itemsStat.textContent = items.length ? items.join(', ') : 'None';
    jobsStat.textContent = jobs.length ? jobs.join(', ') : 'None';
  }

  depositBtn.addEventListener('click', () => {
    let amt = parseInt(depositInput.value);
    if (!isNaN(amt) && amt > 0 && amt <= cash) {
      cash -= amt;
      bank += amt;
      updateStats();
    }
    depositInput.value = '';
  });

  withdrawBtn.addEventListener('click', () => {
    let amt = parseInt(withdrawInput.value);
    if (!isNaN(amt) && amt > 0 && amt <= bank) {
      bank -= amt;
      cash += amt;
      updateStats();
    }
    withdrawInput.value = '';
  });

  updateStats();
</script>

</body>
</html>
