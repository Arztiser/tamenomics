<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bank</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8f0;
      color: #2c9118;
      margin: 20px;
    }
    .bank-container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #2c9118aa;
    }
    h1 {
      text-align: center;
    }
    .balance {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    input[type="number"] {
      width: 80%;
      padding: 10px;
      font-size: 18px;
      border: 2px solid #2c9118;
      border-radius: 6px;
      margin-bottom: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    button {
      background-color: #2c9118;
      border: none;
      color: white;
      padding: 10px 25px;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      width: 45%;
      display: inline-block;
    }
    button:hover {
      background-color: #237b14;
    }
    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="bank-container">
    <h1>Bank</h1>
    <div class="balance" id="balance-display">Bank Balance: $0</div>
    <input type="number" id="amount" placeholder="Enter amount" min="1" />
    <div style="text-align:center;">
      <button onclick="deposit()">Deposit</button>
      <button onclick="withdraw()">Withdraw</button>
    </div>
    <div class="message" id="message"></div>
  </div>

  <script>
    // Dummy variables for now
    let bankBalance = 1000;
    let cashBalance = 500;

    function updateBalance() {
      document.getElementById('balance-display').innerText = `Bank Balance: $${bankBalance}`;
    }

    function showMessage(msg, isError = false) {
      const messageEl = document.getElementById('message');
      messageEl.style.color = isError ? 'red' : 'green';
      messageEl.innerText = msg;
      setTimeout(() => { messageEl.innerText = ''; }, 3000);
    }

    function deposit() {
      const amountInput = document.getElementById('amount');
      const amount = Number(amountInput.value);
      if (amount <= 0 || isNaN(amount)) {
        showMessage('Please enter a valid amount.', true);
        return;
      }
      if (amount > cashBalance) {
        showMessage("You don't have enough cash to deposit.", true);
        return;
      }
      cashBalance -= amount;
      bankBalance += amount;
      updateBalance();
      showMessage(`Deposited $${amount} successfully.`);
      amountInput.value = '';
    }

    function withdraw() {
      const amountInput = document.getElementById('amount');
      const amount = Number(amountInput.value);
      if (amount <= 0 || isNaN(amount)) {
        showMessage('Please enter a valid amount.', true);
        return;
      }
      if (amount > bankBalance) {
        showMessage("You don't have enough money in the bank.", true);
        return;
      }
      bankBalance -= amount;
      cashBalance += amount;
      updateBalance();
      showMessage(`Withdrew $${amount} successfully.`);
      amountInput.value = '';
    }

    updateBalance();
  </script>
</body>
</html>
