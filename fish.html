<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2c9118" />
<meta name="description" content="Fish at various locations and catch random fish to add to your inventory on Tamenomics." />
<title>Fishing - Tamenomics</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Jersey 10', sans-serif;
    margin: 0; padding: 0;
    background: #f9fff7;
    color: #2c9118;
    font-size: 20px;
  }
  header {
    background: #2c9118;
    color: white;
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 {
    margin: 0;
    font-weight: 700;
  }
  header .menu-icon {
    font-size: 28px;
    cursor: pointer;
  }
  .topnav-right {
    display: none;
    position: fixed;
    top: 52px; right: 0;
    width: 100%;
    height: calc(100vh - 52px);
    background: #2c9118;
    color: white;
    flex-direction: column;
    overflow-y: auto;
    z-index: 999;
  }
  .topnav.active .topnav-right {
    display: flex;
  }
  .accordion-section {
    border-top: 1px solid #1a5f0d;
  }
  .accordion-toggle {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    padding: 14px 20px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: 'Jersey 10', sans-serif;
  }
  .accordion-content {
    display: none;
    flex-direction: column;
    background: #1f7f13;
  }
  .accordion-section.open .accordion-content {
    display: flex;
  }
  .accordion-content a {
    color: white;
    text-decoration: none;
    padding: 10px 32px;
    font-size: 18px;
    border-top: 1px solid #166f0f;
  }
  .accordion-content a:hover {
    background: #166f0f;
  }

  main {
    padding: 20px;
    max-width: 600px;
    margin: auto;
  }

  .info {
    margin-bottom: 16px;
  }
  select, button {
    font-family: 'Jersey 10', sans-serif;
    font-size: 18px;
    padding: 10px 14px;
    border: 2px solid #2c9118;
    border-radius: 8px;
    background: white;
    color: #2c9118;
    cursor: pointer;
    margin-right: 10px;
  }
  button:disabled {
    background: #a6d6a3;
    cursor: not-allowed;
  }
  #result {
    margin-top: 24px;
    font-weight: 700;
  }

  #inventory {
    margin-top: 40px;
    border-top: 2px solid #2c9118;
    padding-top: 20px;
  }
  #inventory h2 {
    margin-bottom: 10px;
  }
  #inventory-list {
    list-style: none;
    padding-left: 0;
    font-size: 18px;
  }
</style>
</head>
<body>
<header>
  <h1>Tamenomics</h1>
  <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
  <nav class="topnav-right">
    <div class="accordion-section">
      <button class="accordion-toggle">Actions</button>
      <div class="accordion-content">
        <a href="hunt.html">Hunt</a>
        <a href="fish.html" style="background:#166f0f;">Fish</a>
        <a href="crime.html">Crime</a>
        <a href="search.html">Search</a>
      </div>
    </div>
    <div class="accordion-section">
      <button class="accordion-toggle">Economy</button>
      <div class="accordion-content">
        <a href="bank.html">Bank</a>
        <a href="shop.html">Shop</a>
        <a href="sell.html">Sell</a>
        <a href="jobs.html">Jobs</a>
        <a href="casino.html">Casino</a>
      </div>
    </div>
  </nav>
</header>

<main>
  <div class="info">
    <p><strong>Note:</strong> You need a Fishing Rod in your inventory to fish.</p>
    <p>You can fish once every 30 minutes.</p>
  </div>

  <label for="location">Choose a Fishing Location:</label>
  <select id="location">
    <option value="river">River</option>
    <option value="lake">Lake</option>
    <option value="ocean">Ocean</option>
  </select>
  <button id="fish-btn" onclick="attemptFish()">Fish</button>

  <div id="result"></div>

  <section id="inventory">
    <h2>Your Fish Inventory</h2>
    <ul id="inventory-list"></ul>
  </section>
</main>

<script>
  // Inventory mockup, in real use replace with backend or localStorage
  const inventoryKey = 'tamenomics_inventory';
  const lastFishKey = 'tamenomics_last_fish';
  
  // Fish types by location
  const fishTypes = {
    river: ['Trout', 'Catfish', 'Bass'],
    lake: ['Perch', 'Pike', 'Bluegill'],
    ocean: ['Salmon', 'Tuna', 'Mackerel']
  };
  
  // Load inventory from localStorage or start fresh
  function loadInventory() {
    const raw = localStorage.getItem(inventoryKey);
    return raw ? JSON.parse(raw) : { 'Fishing Rod': 1 };
  }
  
  function saveInventory(inv) {
    localStorage.setItem(inventoryKey, JSON.stringify(inv));
  }
  
  // Check fishing cooldown (30 minutes)
  function canFish() {
    const last = localStorage.getItem(lastFishKey);
    if (!last) return true;
    const lastTime = new Date(parseInt(last, 10));
    const now = new Date();
    const diff = (now - lastTime) / 1000 / 60; // minutes
    return diff >= 30;
  }
  
  // Update inventory UI
  function updateInventoryUI() {
    const inv = loadInventory();
    const list = document.getElementById('inventory-list');
    list.innerHTML = '';
    for (const [item, qty] of Object.entries(inv)) {
      if (qty > 0 && item !== 'Fishing Rod') {
        const li = document.createElement('li');
        li.textContent = `${item}: ${qty}`;
        list.appendChild(li);
      }
    }
  }
  
  function attemptFish() {
    const inv = loadInventory();
    if (!inv['Fishing Rod'] || inv['Fishing Rod'] < 1) {
      alert('You need a Fishing Rod to fish!');
      return;
    }
    if (!canFish()) {
      alert('You can only fish once every 30 minutes.');
      return;
    }
    
    const location = document.getElementById('location').value;
    const fishList = fishTypes[location];
    
    // Random fish from location
    const catchFish = fishList[Math.floor(Math.random() * fishList.length)];
    
    // Update inventory
    inv[catchFish] = (inv[catchFish] || 0) + 1;
    saveInventory(inv);
    
    // Save last fish time
    localStorage.setItem(lastFishKey, Date.now().toString());
    
    // Show result
    document.getElementById('result').textContent = `You caught a ${catchFish}! 🎣`;
    updateInventoryUI();
  }
  
  // Accordion menu toggle
  function toggleMenu() {
    document.querySelector('header').classList.toggle('active');
    document.querySelector('.topnav-right').classList.toggle('active');
    document.body.classList.toggle('menu-open');
  }
  document.querySelectorAll('.accordion-toggle').forEach(button => {
    button.addEventListener('click', () => {
      const section = button.parentElement;
      document.querySelectorAll('.accordion-section').forEach(s => {
        if (s !== section) s.classList.remove('open');
      });
      section.classList.toggle('open');
    });
  });
  
  // Init
  updateInventoryUI();
</script>

</body>
</html>
