<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c9118">
  <meta name="description" content="Tamenomics - Economy System for Tamo Bot">
  <title>Tamenomics</title>
  <link rel="icon" type="image/png" href="/img/pfp.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }.topnav {
  background-color: #2c9118;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 60px;
  color: #fff;
}

.topnav h1 {
  font-size: 24px;
  margin: 0;
}

.menu-icon {
  font-size: 30px;
  cursor: pointer;
}

.topnav-right {
  display: none;
  position: fixed;
  top: 60px;
  right: 0;
  background-color: #2c9118;
  width: 100%;
  height: 100vh;
  flex-direction: column;
  z-index: 999;
  overflow-y: auto;
}

.topnav.active .topnav-right {
  display: flex;
}

.accordion-section {
  border-top: 1px solid #1e6813;
}

.accordion-toggle {
  background: none;
  color: white;
  padding: 14px;
  text-align: left;
  font-size: 24px;
  border: none;
  width: 100%;
  cursor: pointer;
}

.accordion-content {
  display: none;
  flex-direction: column;
  background-color: #3db728;
}

.accordion-section.open .accordion-content {
  display: flex;
}

.accordion-content a {
  padding: 10px 28px;
  border-top: 1px solid #2c9118;
  font-size: 20px;
  color: white;
  text-decoration: none;
}

.container {
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 36px;
  color: #2c9118;
}

p {
  font-size: 24px;
  color: #333;
}

  </style>
</head>
<body>
  <header>
    <div class="topnav">
      <h1>Tamenomics</h1>
      <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
      <div class="topnav-right">
        <div class="accordion-section">
          <button class="accordion-toggle">Actions</button>
          <div class="accordion-content">
            <a href="hunt.html">Hunting</a>
            <a href="fish.html">Fishing</a>
            <a href="crime.html">Crime</a>
            <a href="search.html">Search</a>
            <a href="job.html">Daily Job</a>
          </div>
        </div>
        <div class="accordion-section">
          <button class="accordion-toggle">Economy</button>
          <div class="accordion-content">
            <a href="bank.html">Bank</a>
            <a href="inventory.html">Inventory</a>
            <a href="shop.html">Shop</a>
            <a href="sell.html">Sell</a>
            <a href="casino.html">Casino</a>
          </div>
        </div>
      </div>
    </div>
  </header>  <div class="container">
    <h1>Welcome To Tamenomics</h1>
    <p>Manage Your Economy, Explore Adventures, And Build Your Wealth.</p>
  </div>  <script>
    function toggleMenu() {
      const topnav = document.querySelector('.topnav');
      const body = document.body;
      topnav.classList.toggle('active');
      body.classList.toggle('menu-open');
    }

    document.querySelectorAll('.accordion-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const section = btn.parentElement;
        document.querySelectorAll('.accordion-section').forEach(s => {
          if (s !== section) s.classList.remove('open');
        });
        section.classList.toggle('open');
      });
    });
  </script></body>
</html>
