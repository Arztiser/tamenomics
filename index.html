<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamenomics 2</title>
    <!-- Jersey 10 font -->
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jersey 10', sans-serif;
            background-color: #fff;
            color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000;
            color: #fff;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.85;
        }

        nav {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 15px;
            border: 2px solid #fff;
            border-radius: 6px;
            transition: all 0.3s;
        }

        nav a:hover {
            background-color: #ff0;
            color: #000;
            border-color: #ff0;
        }

        main {
            flex: 1;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stats-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }

        .stat-card {
            background-color: #000;
            color: #fff;
            padding: 25px 35px;
            border-radius: 12px;
            min-width: 180px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: scale(1.05);
        }

        .stat-card h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 2rem;
            font-weight: bold;
            color: #ff0;
        }

        footer {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        footer a {
            color: #ff0;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tamenomics 2</h1>
        <p>The Economy, Upgraded</p>
        <nav>
            <a href="#" id="bank-btn">Bank</a>
            <a href="#" id="jobs-btn">Jobs</a>
            <a href="#" id="inventory-btn">Inventory</a>
            <a href="#" id="mini-game-btn">Mini-Game</a>
        </nav>
    </header>

    <main>
        <h2>Welcome to Tamenomics 2!</h2>
        <p>Deposit money, get jobs, buy items, hunt/fish, and have fun!</p>

        <div class="stats-container">
            <div class="stat-card">
                <h2>Balance</h2>
                <p id="balance">$0</p>
            </div>
            <div class="stat-card">
                <h2>Items</h2>
                <p id="items">None</p>
            </div>
            <div class="stat-card">
                <h2>Jobs</h2>
                <p id="jobs">None</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Arztiser | <a href="#">Contact</a></p>
    </footer>

    <script>
        let balance = 0;
        let items = [];
        let jobs = [];

        const balanceEl = document.getElementById('balance');
        const itemsEl = document.getElementById('items');
        const jobsEl = document.getElementById('jobs');

        document.getElementById('bank-btn').addEventListener('click', function(e) {
            e.preventDefault();
            balance += 100;
            balanceEl.textContent = `$${balance}`;
        });

        document.getElementById('jobs-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const newJob = `Job #${jobs.length + 1}`;
            jobs.push(newJob);
            jobsEl.textContent = jobs.join(', ');
        });

        document.getElementById('inventory-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const newItem = `Item #${items.length + 1}`;
            items.push(newItem);
            itemsEl.textContent = items.join(', ');
        });

        document.getElementById('mini-game-btn').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Mini-game coming soon!');
        });
    </script>

</body>
</html>
