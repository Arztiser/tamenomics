<!-- Initial file: index.html --><!-- This will serve as the main hub for Tamenomics --><!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c9118" />
  <title>Tamenomics</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topnav">
    <h1><a href="index.html" class="logo">Tamenomics</a></h1>
    <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
    <nav class="topnav-right">
      <div class="accordion-section">
        <button class="accordion-toggle">Economy</button>
        <div class="accordion-content">
          <a href="bank.html">Bank</a>
          <a href="shop.html">Shop</a>
          <a href="sell.html">Sell</a>
          <a href="inventory.html">Inventory</a>
        </div>
      </div>
      <div class="accordion-section">
        <button class="accordion-toggle">Actions</button>
        <div class="accordion-content">
          <a href="hunt.html">Hunt</a>
          <a href="fish.html">Fish</a>
          <a href="casino.html">Casino</a>
          <a href="job.html">Jobs</a>
          <a href="crime.html">Crime</a>
          <a href="search.html">Search</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="container">
    <h1>Welcome To Tamenomics</h1>
    <p>Track Your Economy, Hunt, Fish, Work, And More!</p>
    <p>Your Legacy Begins Here.</p>
  </main>  <script>
    function toggleMenu() {
      document.querySelector('.topnav').classList.toggle('active');
      document.body.classList.toggle('menu-open');
    }
    document.querySelectorAll('.accordion-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const sec = btn.parentElement;
        document.querySelectorAll('.accordion-section').forEach(s => {
          if (s !== sec) s.classList.remove('open');
        });
        sec.classList.toggle('open');
      });
    });
  </script></body>
</html>
