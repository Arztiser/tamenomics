<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2c9118">
  <title>Tamenomics - Home</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #222;
    }.topnav {
  background-color: #2c9118;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 16px;
  height: 60px;
}

.topnav h1 {
  margin: 0;
  font-size: 28px;
}

.menu-icon {
  font-size: 30px;
  cursor: pointer;
}

.topnav-right {
  display: none;
  position: fixed;
  top: 60px;
  right: 0;
  width: 100%;
  height: 100vh;
  background-color: #2c9118;
  flex-direction: column;
  z-index: 999;
}

.topnav.active .topnav-right {
  display: flex;
}

.accordion-toggle {
  background: none;
  border: none;
  color: white;
  font-size: 24px;
  padding: 16px;
  text-align: left;
  width: 100%;
  cursor: pointer;
}

.accordion-content {
  display: none;
  flex-direction: column;
  background-color: #3aa92f;
}

.accordion-content a {
  color: white;
  padding: 12px 24px;
  text-decoration: none;
  font-size: 20px;
  border-top: 1px solid #ffffff55;
}

.accordion-section.open .accordion-content {
  display: flex;
}

.container {
  padding: 20px;
}

.feature-card {
  background-color: white;
  border-radius: 12px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  padding: 20px;
  margin-bottom: 20px;
  text-align: center;
  transition: transform 0.2s;
}

.feature-card:hover {
  transform: scale(1.02);
}

.feature-card a {
  text-decoration: none;
  color: #2c9118;
  font-size: 24px;
}

  </style>
</head>
<body>
  <header>
    <div class="topnav">
      <h1>Tamenomics</h1>
      <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
      <div class="topnav-right">
        <div class="accordion-section">
          <button class="accordion-toggle">Main Menu</button>
          <div class="accordion-content">
            <a href="index.html">Home</a>
            <a href="bank.html">Bank</a>
            <a href="inventory.html">Inventory</a>
            <a href="shop.html">Shop</a>
            <a href="hunt.html">Hunting</a>
            <a href="fish.html">Fishing</a>
            <a href="casino.html">Casino</a>
            <a href="job.html">Jobs</a>
            <a href="crime.html">Crime</a>
            <a href="search.html">Search</a>
            <a href="sell.html">Sell Items</a>
          </div>
        </div>
      </div>
    </div>
  </header>  <div class="container">
    <div class="feature-card"><a href="bank.html">Bank</a></div>
    <div class="feature-card"><a href="inventory.html">Inventory</a></div>
    <div class="feature-card"><a href="shop.html">Shop</a></div>
    <div class="feature-card"><a href="hunt.html">Go Hunting</a></div>
    <div class="feature-card"><a href="fish.html">Go Fishing</a></div>
    <div class="feature-card"><a href="casino.html">Casino</a></div>
    <div class="feature-card"><a href="job.html">Jobs</a></div>
    <div class="feature-card"><a href="crime.html">Crime</a></div>
    <div class="feature-card"><a href="search.html">Search</a></div>
    <div class="feature-card"><a href="sell.html">Sell Items</a></div>
  </div>  <script>
    function toggleMenu() {
      const topnav = document.querySelector('.topnav');
      const body = document.body;
      topnav.classList.toggle('active');
      body.classList.toggle('menu-open');
    }

    document.querySelectorAll('.accordion-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const parent = toggle.parentElement;
        document.querySelectorAll('.accordion-section').forEach(section => {
          if (section !== parent) section.classList.remove('open');
        });
        parent.classList.toggle('open');
      });
    });
  </script></body>
</html>
