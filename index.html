<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamenomics 2</title>
    <style>
        /* ... keep the same CSS from before ... */
    </style>
</head>
<body>

    <header>
        <h1>Tamenomics 2</h1>
        <p>The Economy, Upgraded</p>
        <nav>
            <a href="#" id="bank-btn">Bank</a>
            <a href="#" id="jobs-btn">Jobs</a>
            <a href="#" id="inventory-btn">Inventory</a>
            <a href="#" id="mini-game-btn">Mini-Game</a>
        </nav>
    </header>

    <main>
        <h2>Welcome to Tamenomics 2!</h2>
        <p>Deposit money, get jobs, buy items, hunt/fish, and have fun!</p>

        <div class="stats-container">
            <div class="stat-card">
                <h2>Balance</h2>
                <p id="balance">$0</p>
            </div>
            <div class="stat-card">
                <h2>Items</h2>
                <p id="items">None</p>
            </div>
            <div class="stat-card">
                <h2>Jobs</h2>
                <p id="jobs">None</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Arztiser | <a href="#">Contact</a></p>
    </footer>

    <script>
        // Initial stats
        let balance = 0;
        let items = [];
        let jobs = [];

        // Elements
        const balanceEl = document.getElementById('balance');
        const itemsEl = document.getElementById('items');
        const jobsEl = document.getElementById('jobs');

        // Example actions
        document.getElementById('bank-btn').addEventListener('click', function(e) {
            e.preventDefault();
            balance += 100; // add $100 for demo
            balanceEl.textContent = `$${balance}`;
        });

        document.getElementById('jobs-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const newJob = `Job #${jobs.length + 1}`;
            jobs.push(newJob);
            jobsEl.textContent = jobs.join(', ');
        });

        document.getElementById('inventory-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const newItem = `Item #${items.length + 1}`;
            items.push(newItem);
            itemsEl.textContent = items.join(', ');
        });

        document.getElementById('mini-game-btn').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Mini-game coming soon!');
        });
    </script>
</body>
</html>
