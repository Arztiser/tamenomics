<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamenomics 2</title>
    <!-- Jersey 10 font -->
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jersey 10', sans-serif;
            background-color: #fff;
            color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c9118;
            color: #fff;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* Accordion Menu */
        .accordion {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            border: 2px solid #2c9118;
            border-radius: 10px;
            overflow: hidden;
        }

        .accordion-item {
            background-color: #fff;
            border-bottom: 1px solid #2c9118;
        }

        .accordion-header {
            padding: 15px 20px;
            cursor: pointer;
            font-weight: bold;
            background-color: #2c9118;
            color: #fff;
            transition: background 0.3s;
        }

        .accordion-header:hover {
            background-color: #1f6d13;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background-color: #f5f5f5;
            padding: 0 20px;
        }

        .accordion-content a {
            display: block;
            padding: 10px 0;
            color: #2c9118;
            text-decoration: none;
            transition: color 0.3s;
        }

        .accordion-content a:hover {
            color: #1f6d13;
        }

        main {
            flex: 1;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stats-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }

        .stat-card {
            background-color: #000;
            color: #fff;
            padding: 25px 35px;
            border-radius: 12px;
            min-width: 180px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: scale(1.05);
        }

        .stat-card h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 2rem;
            font-weight: bold;
            color: #2c9118;
        }

        footer {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        footer a {
            color: #2c9118;
            text-decoration: none;
        }

    </style>
</head>
<body>

    <header>
        <h1>Tamenomics 2</h1>
        <p>The Economy, Upgraded</p>
    </header>

    <!-- Accordion Menu -->
    <div class="accordion">
        <div class="accordion-item">
            <div class="accordion-header">Pages</div>
            <div class="accordion-content">
                <a href="#">Bank</a>
                <a href="#">Jobs</a>
                <a href="#">Fishing</a>
                <a href="#">Hunting</a>
                <a href="#">Shop</a>
                <a href="#">Items</a>
                <a href="#">Mini-Games</a>
            </div>
        </div>
    </div>

    <main>
        <h2>Welcome to Tamenomics 2!</h2>
        <p>Deposit money, get jobs, buy items, hunt/fish, and have fun!</p>

        <div class="stats-container">
            <div class="stat-card">
                <h2>Balance</h2>
                <p id="balance">$0</p>
            </div>
            <div class="stat-card">
                <h2>Items</h2>
                <p id="items">None</p>
            </div>
            <div class="stat-card">
                <h2>Jobs</h2>
                <p id="jobs">None</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Arztiser | <a href="#">Contact</a></p>
    </footer>

    <script>
        // Accordion functionality
        const headers = document.querySelectorAll('.accordion-header');
        headers.forEach(header => {
            header.addEventListener('click', () => {
                const content = header.nextElementSibling;
                if (content.style.maxHeight) {
                    content.style.maxHeight = null;
                } else {
                    content.style.maxHeight = content.scrollHeight + "px";
                }
            });
        });

        // Stats functionality
        let balance = 0;
        let items = [];
        let jobs = [];

        const balanceEl = document.getElementById('balance');
        const itemsEl = document.getElementById('items');
        const jobsEl = document.getElementById('jobs');

        // For demo: clicking accordion links updates stats
        document.querySelectorAll('.accordion-content a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.textContent;

                if(page === "Bank") balance += 100;
                if(page === "Jobs") jobs.push(`Job #${jobs.length + 1}`);
                if(page === "Items") items.push(`Item #${items.length + 1}`);

                balanceEl.textContent = `$${balance}`;
                itemsEl.textContent = items.length > 0 ? items.join(', ') : "None";
                jobsEl.textContent = jobs.length > 0 ? jobs.join(', ') : "None";
            });
        });
    </script>

</body>
</html>
