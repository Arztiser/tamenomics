<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunting - Tamenomics 2</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

<style>
body { font-family: 'Jersey 10', sans-serif; background: #fff; color: #000; margin: 0; padding: 0; }
header { background: #2c9118; color: #fff; padding: 25px 20px; text-align: center; }
header h1 { font-size: 2.5rem; margin: 0; cursor: pointer; }
nav { margin-top: 10px; }
nav a { color: #fff; text-decoration: none; margin: 0 10px; font-size: 1.1rem; font-weight: bold; }
nav a:hover { color: #000; }
main { max-width: 700px; margin: 30px auto; background: #fff; border-radius: 12px; box-shadow: 0 0 15px rgba(44,145,24,0.3); padding: 30px; text-align: center; }
h2 { color: #2c9118; font-size: 2rem; margin-bottom: 20px; }
button { width: 90%; padding: 12px; font-family: 'Jersey 10', sans-serif; margin: 12px 0; border: 2px solid #2c9118; border-radius: 8px; font-size: 1.1rem; background: #2c9118; color: #fff; cursor: pointer; }
button:hover { background: #1f6d13; }
button:disabled { background: #aaa; cursor: not-allowed; }
#message { font-size: 1.3rem; margin-top: 20px; }
footer { text-align: center; padding: 20px; background: #000; color: #fff; margin-top: 30px; }
</style>
</head>
<body>

<header>
<h1 onclick="location.href='index.html'">Tamenomics 2</h1>
<nav>
  <a href="bank.html">Bank</a>
  <a href="jobs.html">Jobs</a>
  <a href="fishing.html">Fishing</a>
  <a href="hunting.html">Hunting</a>
  <a href="shop.html">Shop</a>
  <a href="items.html">Items</a>
  <a href="minigames.html">Mini-Games</a>
</nav>
</header>

<main>
<h2>Hunting</h2>

<div id="cooldown" style="color:red; font-size:1.3rem; display:none;">
  You can hunt once per hour.
</div>

<div id="noweapon" style="color:red; font-size:1.3rem; display:none;">
  You need a Rifle or Bow & Arrow to hunt.
</div>

<button id="hunt-btn">Go Hunting!</button>

<div id="message"></div>

</main>

<footer>&copy; 2025 Arztiser</footer>

<script>
let items = JSON.parse(localStorage.getItem('items')) || {};

function saveItems() {
  localStorage.setItem('items', JSON.stringify(items));
}

function addItem(itemName) {
  if (!items[itemName]) items[itemName] = 0;
  items[itemName]++;
  saveItems();
}

const animals = [
  "Bear", "Boar", "Skunk", "Deer",
  "Dragon", "Duck", "Armadillo"
];

const COOLDOWN = 60 * 60 * 1000; // 1 hour
let lastHunt = parseInt(localStorage.getItem("lastHuntTime")) || 0;

function checkCooldown() {
  const now = Date.now();
  if (now - lastHunt < COOLDOWN) {
    document.getElementById("cooldown").style.display = "block";
    return true;
  }
  document.getElementById("cooldown").style.display = "none";
  return false;
}

document.getElementById("hunt-btn").addEventListener("click", () => {

  if (checkCooldown()) return;

  const hasRifle = items["Rifle"] > 0;
  const hasBow = items["Bow"] > 0;

  if (!hasRifle && !hasBow) {
    document.getElementById("noweapon").style.display = "block";
    return;
  } else {
    document.getElementById("noweapon").style.display = "none";
  }

  let result = "";
  let caught = null;

  if (hasRifle) {
    const breakChance = Math.random() < 0.10;
    const missChance = Math.random() < 0.05;

    if (breakChance) {
      items["Rifle"]--;
      saveItems();
      result = "Your rifle broke!";
    } else if (missChance) {
      result = "You missed and caught nothing.";
    } else {
      caught = animals[Math.floor(Math.random() * animals.length)];
      addItem(caught);
      result = `You caught: ${caught}!`;
    }

  } else if (hasBow) {
    const breakChance = Math.random() < 0.20;
    const success = Math.random() < 0.75;

    if (breakChance) {
      items["Bow"]--;
      saveItems();
      result = "Your bow snapped!";
    } else if (!success) {
      result = "You missed and caught nothing.";
    } else {
      caught = animals[Math.floor(Math.random() * animals.length)];
      addItem(caught);
      result = `You caught: ${caught}!`;
    }
  }

  document.getElementById("message").innerText = result;

  lastHunt = Date.now();
  localStorage.setItem("lastHuntTime", lastHunt);
  checkCooldown();
});

checkCooldown();
</script>

</body>
</html>
