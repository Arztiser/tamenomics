<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2c9118">
  <meta name="description" content="Get A Job - Tamenomics Discord Bot Economy">
  <title>Jobs - Tamenomics</title>
  <link rel="icon" href="./img/pfp.png">
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #2c9118;
    }
    header {
      background-color: #2c9118;
      padding: 12px 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      cursor: pointer;
    }
    .menu-icon {
      font-size: 30px;
      cursor: pointer;
    }
    .topnav-right {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      background-color: #2c9118;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      z-index: 999;
      overflow-y: auto;
    }
    .topnav.active .topnav-right {
      display: flex;
    }
    body.menu-open {
      overflow: hidden;
    }
    .accordion-toggle {
      background: none;
      color: white;
      padding: 14px;
      font-size: 24px;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .accordion-content {
      display: none;
      flex-direction: column;
      background-color: #1e6f12;
    }
    .accordion-content a {
      padding: 12px 28px;
      border-top: 1px solid #146f0e;
      font-size: 20px;
      color: white;
      text-decoration: none;
    }
    .accordion-content a:hover {
      background: #146f0e;
    }
    .accordion-section {
      border-top: 1px solid #1e6f12;
    }
    .accordion-section.open .accordion-content {
      display: flex;
    }
    main {
      max-width: 600px;
      margin: 24px auto;
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 10px rgba(44, 145, 24, 0.3);
    }
    h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    .job-list, .job-details, .current-job {
      margin-bottom: 24px;
    }
    .job-list button, .job-details button, .current-job button {
      font-family: 'Jersey 10', sans-serif;
      font-size: 22px;
      background: #2c9118;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      margin-top: 12px;
      cursor: pointer;
    }
    .job-list li {
      margin-bottom: 10px;
    }
    .message {
      margin-top: 16px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header>
    <h1 onclick="location.href='/'">Tamenomics</h1>
    <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
    <nav class="topnav-right">
      <div class="accordion-section">
        <button class="accordion-toggle">Actions</button>
        <div class="accordion-content">
          <a href="hunt.html">Hunt</a>
          <a href="fish.html">Fish</a>
          <a href="crime.html">Crime</a>
          <a href="search.html">Search</a>
        </div>
      </div>
      <div class="accordion-section">
        <button class="accordion-toggle">Economy</button>
        <div class="accordion-content">
          <a href="bank.html">Bank</a>
          <a href="casino.html">Casino</a>
          <a href="jobs.html" class="active">Jobs</a>
          <a href="shop.html">Shop</a>
          <a href="sell.html">Sell</a>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <h2>Get A Job</h2>
    <div class="job-list">
      <p>Available Jobs:</p>
      <ul id="job-options"></ul>
    </div>
    <div class="job-details" id="job-details"></div>
    <div class="current-job" id="current-job"></div>
    <div class="message" id="message"></div>
  </main>
  <script>
    const jobs = [
      { title: "Trash Collector", wage: 5000, chance: 0.9 },
      { title: "Bartender", wage: 7500, chance: 0.7 },
      { title: "Tech Support", wage: 10000, chance: 0.6 },
      { title: "Teacher", wage: 8500, chance: 0.75 },
      { title: "Dog Walker", wage: 4000, chance: 0.95 },
      { title: "Chef", wage: 9200, chance: 0.65 },
      { title: "Courier", wage: 6300, chance: 0.85 }
    ];let currentJob = null;
let lastWorked = Date.now();

function getRandomJobs() {
  const shuffled = jobs.sort(() => 0.5 - Math.random());
  return shuffled.slice(0, 3);
}

function displayJobs() {
  const jobList = document.getElementById("job-options");
  jobList.innerHTML = "";
  getRandomJobs().forEach(job => {
    const li = document.createElement("li");
    li.innerHTML = `${job.title} - $${job.wage}/day <button onclick='applyJob(${JSON.stringify(JSON.stringify(job))})'>Apply</button>`;
    jobList.appendChild(li);
  });
}

function applyJob(jobStr) {
  const job = JSON.parse(jobStr);
  const success = Math.random() < job.chance;
  const message = document.getElementById("message");
  if (success) {
    currentJob = job;
    lastWorked = Date.now();
    message.innerText = `You got the job as ${job.title}! You earn $${job.wage} daily.`;
    updateCurrentJob();
  } else {
    message.innerText = `You were not accepted for the job.`;
  }
}

function updateCurrentJob() {
  const section = document.getElementById("current-job");
  if (!currentJob) {
    section.innerHTML = "<p>You are currently unemployed.</p>";
    return;
  }
  section.innerHTML = `
    <p>Current Job: ${currentJob.title}</p>
    <button onclick="quitJob()">Quit Job</button>
    <button onclick="workJob()">Work Today</button>
  `;
}

function workJob() {
  const now = Date.now();
  if (now - lastWorked < 24 * 60 * 60 * 1000) {
    document.getElementById("message").innerText = "You already worked today.";
    return;
  }
  lastWorked = now;
  // Increase user's cash here (link with inventory/cash management)
  document.getElementById("message").innerText = `You worked as a ${currentJob.title} and earned $${currentJob.wage}.`;
}

function quitJob() {
  currentJob = null;
  updateCurrentJob();
  document.getElementById("message").innerText = "You quit your job.";
}

function toggleMenu() {
  document.querySelector('header').classList.toggle('active');
  document.querySelector('.topnav-right').classList.toggle('active');
  document.body.classList.toggle('menu-open');
}

document.querySelectorAll('.accordion-toggle').forEach(btn =>
  btn.addEventListener('click', () => {
    const section = btn.parentElement;
    document.querySelectorAll('.accordion-section').forEach(s => {
      if (s !== section) s.classList.remove('open');
    });
    section.classList.toggle('open');
  })
);

displayJobs();
updateCurrentJob();

  </script>
</body>
</html>
