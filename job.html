<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c9118" />
  <meta name="description" content="Get A Job - Tamenomics Discord Bot Economy" />
  <title>Jobs - Tamenomics</title>
  <link rel="icon" href="./img/pfp.png" />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #2c9118;
    }
    header {
      background-color: #2c9118;
      padding: 12px 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 28px;
      cursor: pointer;
    }
    .menu-icon {
      font-size: 30px;
      cursor: pointer;
    }
    .topnav-right {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      background-color: #2c9118;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      z-index: 999;
      overflow-y: auto;
    }
    .topnav.active .topnav-right {
      display: flex;
    }
    body.menu-open {
      overflow: hidden;
    }
    .accordion-toggle {
      background: none;
      color: white;
      padding: 14px;
      font-size: 24px;
      border: none;
      outline: none;
      cursor: pointer;
      width: 100%;
      font-family: 'Jersey 10', sans-serif;
    }
    .accordion-content {
      display: none;
      flex-direction: column;
      background-color: #1e6f12;
    }
    .accordion-content a {
      padding: 12px 28px;
      border-top: 1px solid #146f0e;
      font-size: 20px;
      color: white;
      text-decoration: none;
    }
    .accordion-content a:hover {
      background: #146f0e;
    }
    .accordion-section {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #1e6f12;
    }
    .accordion-section.open .accordion-content {
      display: flex;
    }
    main {
      max-width: 600px;
      margin: 24px auto;
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 10px rgba(44, 145, 24, 0.3);
    }
    h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    button {
      font-family: 'Jersey 10', sans-serif;
      font-size: 20px;
      padding: 10px 20px;
      background: #2c9118;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #238110;
    }
    .job-option {
      margin-bottom: 20px;
      padding: 12px;
      border: 2px solid #2c9118;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1 onclick="location.href='/'">Tamenomics</h1>
    <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
    <nav class="topnav-right">
      <div class="accordion-section">
        <button class="accordion-toggle">Actions</button>
        <div class="accordion-content">
          <a href="hunt.html">Hunt</a>
          <a href="fish.html">Fish</a>
          <a href="crime.html">Crime</a>
          <a href="search.html">Search</a>
        </div>
      </div>
      <div class="accordion-section">
        <button class="accordion-toggle">Economy</button>
        <div class="accordion-content">
          <a href="bank.html">Bank</a>
          <a href="casino.html">Casino</a>
          <a href="jobs.html" class="active">Jobs</a>
          <a href="shop.html">Shop</a>
          <a href="sell.html">Sell</a>
        </div>
      </div>
    </nav>
  </header>  <main>
    <h2>Job Center</h2>
    <div id="job-section"></div>
    <button id="work-btn" style="display:none">Work Today</button>
    <button id="quit-btn" style="display:none">Quit Job</button>
  </main>  <script>
    const jobs = [
      'Janitor', 'Cashier', 'Lawn Mower', 'Barista', 'Mechanic', 'Delivery Driver',
      'Receptionist', 'Dishwasher', 'Tutor', 'Fast Food Worker'
    ];
    const jobSection = document.getElementById('job-section');
    const workBtn = document.getElementById('work-btn');
    const quitBtn = document.getElementById('quit-btn');

    let user = JSON.parse(localStorage.getItem('tamoUser')) || {
      job: null,
      lastWorked: 0,
      cash: 0
    };

    function saveUser() {
      localStorage.setItem('tamoUser', JSON.stringify(user));
    }

    function renderJobs() {
      jobSection.innerHTML = '';
      if (user.job) {
        jobSection.innerHTML = `<p>You Are Currently Working As A <strong>${user.job}</strong>. Daily Pay: $50</p>`;
        workBtn.style.display = 'block';
        quitBtn.style.display = 'block';
      } else {
        const options = [];
        while (options.length < 3) {
          const job = jobs[Math.floor(Math.random() * jobs.length)];
          if (!options.includes(job)) options.push(job);
        }
        options.forEach(job => {
          const chance = Math.floor(Math.random() * 31) + 70;
          const div = document.createElement('div');
          div.className = 'job-option';
          div.innerHTML = `<strong>${job}</strong><br>Pay: $50/day<br>Chance Of Getting Accepted: ${chance}%<br><button onclick="applyJob('${job}', ${chance})">Apply</button>`;
          jobSection.appendChild(div);
        });
      }
    }

    function applyJob(job, chance) {
      if (user.job) {
        alert('You Must Quit Your Current Job First!');
        return;
      }
      if (Math.random() * 100 <= chance) {
        user.job = job;
        saveUser();
        renderJobs();
        alert(`Congratulations! You Got The Job As A ${job}!`);
      } else {
        alert('You Were Not Accepted For The Job. Try Again.');
      }
    }

    function quitJob() {
      user.job = null;
      saveUser();
      renderJobs();
    }

    function workToday() {
      const now = Date.now();
      const dayMs = 24 * 60 * 60 * 1000;
      if (now - user.lastWorked < dayMs) {
        const timeLeft = dayMs - (now - user.lastWorked);
        const hrs = Math.floor(timeLeft / 3600000);
        const mins = Math.floor((timeLeft % 3600000) / 60000);
        alert(`You Can Work Again In ${hrs}h ${mins}m.`);
        return;
      }
      user.lastWorked = now;
      user.cash += 50;
      saveUser();
      alert('You Earned $50 Today!');
    }

    workBtn.onclick = workToday;
    quitBtn.onclick = quitJob;

    function toggleMenu() {
      document.querySelector('header').classList.toggle('active');
      document.querySelector('.topnav-right').classList.toggle('active');
      document.body.classList.toggle('menu-open');
    }
    document.querySelectorAll('.accordion-toggle').forEach(btn =>
      btn.addEventListener('click', () => {
        const section = btn.parentElement;
        document.querySelectorAll('.accordion-section').forEach(s => {
          if (s !== section) s.classList.remove('open');
        });
        section.classList.toggle('open');
      })
    );

    renderJobs();
  </script></body>
</html>
