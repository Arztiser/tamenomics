<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c9118" />
  <meta name="description" content="Jobs - Tamenomics Discord Bot Economy" />
  <title>Jobs - Tamenomics</title>
  <link rel="icon" href="./img/pfp.png" />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #2c9118;
    }
    header {
      background-color: #2c9118;
      padding: 12px 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }
    .menu-icon {
      font-size: 30px;
      cursor: pointer;
      user-select: none;
    }
    .topnav-right {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      background-color: #2c9118;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      z-index: 999;
      overflow-y: auto;
    }
    .topnav.active .topnav-right {
      display: flex;
    }
    body.menu-open {
      overflow: hidden;
    }
    .accordion-toggle {
      background: none;
      color: white;
      padding: 14px;
      text-align: left;
      font-size: 24px;
      border: none;
      outline: none;
      cursor: pointer;
      width: 100%;
      font-family: 'Jersey 10', sans-serif;
      user-select: none;
    }
    .accordion-content {
      display: none;
      flex-direction: column;
      background-color: #1e6f12;
    }
    .accordion-content a {
      padding: 12px 28px;
      border-top: 1px solid #146f0e;
      font-size: 20px;
      color: white;
      text-decoration: none;
      user-select: none;
    }
    .accordion-section {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #1e6f12;
    }
    .accordion-section.open .accordion-content {
      display: flex;
    }
    main {
      max-width: 600px;
      margin: 24px auto;
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 10px rgba(44, 145, 24, 0.3);
    }
    h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    button {
      font-family: 'Jersey 10', sans-serif;
      font-size: 20px;
      padding: 10px 16px;
      margin: 8px;
      background-color: #2c9118;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .message {
      margin-top: 16px;
      font-size: 20px;
    }
    .job {
      margin: 10px 0;
      padding: 10px;
      background: #e7ffe7;
      border-left: 4px solid #2c9118;
    }
  </style>
</head>
<body>
  <header>
    <h1 onclick="location.href='/'">Tamenomics</h1>
    <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
    <nav class="topnav-right">
      <div class="accordion-section">
        <button class="accordion-toggle">Actions</button>
        <div class="accordion-content">
          <a href="hunt.html">Hunt</a>
          <a href="fish.html">Fish</a>
          <a href="crime.html">Crime</a>
          <a href="search.html">Search</a>
        </div>
      </div>
      <div class="accordion-section">
        <button class="accordion-toggle">Economy</button>
        <div class="accordion-content">
          <a href="bank.html">Bank</a>
          <a href="casino.html">Casino</a>
          <a href="jobs.html" class="active">Jobs</a>
          <a href="shop.html">Shop</a>
          <a href="sell.html">Sell</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <h2>Job Center</h2>
    <div id="job-section"></div>
    <button onclick="getPaid()">Claim Daily Pay</button>
    <button onclick="quitJob()">Quit Job</button>
    <div class="message" id="message"></div>
  </main>

  <script>
    const jobs = ["Janitor", "Fast Food Cook", "Lawn Mower", "Grocery Clerk", "Street Musician", "Dog Walker"];
    const pay = 50;
    let currentJob = localStorage.getItem("job") || null;
    let cash = parseInt(localStorage.getItem("cash") || 0);
    let lastPaid = parseInt(localStorage.getItem("lastPaid") || 0);
    const message = document.getElementById("message");
    const jobSection = document.getElementById("job-section");

    function save() {
      localStorage.setItem("job", currentJob);
      localStorage.setItem("cash", cash);
    }

    function renderJobs() {
      jobSection.innerHTML = '';
      if (currentJob) {
        jobSection.innerHTML = `<div class="job"><strong>Your Job:</strong> ${currentJob}</div>`;
        return;
      }

      const offers = [];
      while (offers.length < 3) {
        const job = jobs[Math.floor(Math.random() * jobs.length)];
        if (!offers.includes(job)) offers.push(job);
      }

      offers.forEach(job => {
        const chance = Math.floor(Math.random() * 100) + 1;
        const div = document.createElement("div");
        div.className = "job";
        div.innerHTML = `
          <strong>${job}</strong><br>
          Pay: $${pay}/day<br>
          Acceptance Chance: ${chance}%<br>
          <button onclick="applyJob('${job}', ${chance})">Apply</button>
        `;
        jobSection.appendChild(div);
      });
    }

    function applyJob(job, chance) {
      if (currentJob) {
        message.textContent = "You Already Have A Job. Quit First.";
        return;
      }
      if (Math.random() * 100 < chance) {
        currentJob = job;
        lastPaid = Date.now();
        localStorage.setItem("lastPaid", lastPaid);
        message.textContent = `You Got The Job As A ${job}!`;
        save();
        renderJobs();
      } else {
        message.textContent = `You Didn't Get The ${job} Job.`;
      }
    }

    function getPaid() {
      if (!currentJob) {
        message.textContent = "You Don't Have A Job.";
        return;
      }
      const now = Date.now();
      const oneDay = 24 * 60 * 60 * 1000;
      if (now - lastPaid >= oneDay) {
        cash += pay;
localStorage.setItem('cash', cash);
        lastPaid = now;
        localStorage.setItem("lastPaid", lastPaid);
        save();
        message.textContent = `You Earned $${pay} From Your Job As A ${currentJob}.`;
      } else {
        const hrsLeft = Math.ceil((oneDay - (now - lastPaid)) / (60 * 60 * 1000));
        message.textContent = `You Can Only Get Paid Once Every 24 Hours. Come Back In ${hrsLeft} Hour(s).`;
      }
    }

    function quitJob() {
      if (!currentJob) {
        message.textContent = "You Don't Have A Job.";
        return;
      }
      currentJob = null;
      save();
      message.textContent = "You Quit Your Job.";
      renderJobs();
    }

    function toggleMenu() {
      document.querySelector('header').classList.toggle('active');
      document.querySelector('.topnav-right').classList.toggle('active');
      document.body.classList.toggle('menu-open');
    }

    document.querySelectorAll('.accordion-toggle').forEach(btn =>
      btn.addEventListener('click', () => {
        const section = btn.parentElement;
        document.querySelectorAll('.accordion-section').forEach(s => {
          if (s !== section) s.classList.remove('open');
        });
        section.classList.toggle('open');
      })
    );

    renderJobs();
  </script>
</body>
</html>
