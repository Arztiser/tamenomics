<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs - Tamenomics 2</title>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
body { font-family: 'Jersey 10', sans-serif; background: #fff; color: #000; margin: 0; padding: 0; }
header { background: #2c9118; color: #fff; padding: 25px 20px; text-align: center; }
header h1 { font-size: 2.5rem; margin: 0; cursor: pointer; }
nav { margin-top: 10px; }
nav a { color: #fff; text-decoration: none; margin: 0 10px; font-weight: bold; font-size: 1.1rem; }
nav a:hover { color: #000; }
main { max-width: 700px; margin: 30px auto; background: #fff; border-radius: 12px; box-shadow: 0 0 15px rgba(44,145,24,0.3); padding: 30px 25px; text-align: center; }
h2 { color: #2c9118; margin-bottom: 25px; font-size: 2rem; }
button { padding: 12px 0; width: 90%; font-size: 1rem; font-family: 'Jersey 10', sans-serif; font-weight: bold; border: none; border-radius: 8px; background: #2c9118; color: #fff; cursor: pointer; margin: 8px 0; transition: background 0.3s; display: block; margin-left: auto; margin-right: auto; }
button:hover { background: #1f6d13; }
button:disabled { background: #aaa; cursor: not-allowed; }
select { width: 90%; padding: 10px; font-family: 'Jersey 10', sans-serif; font-size: 1rem; margin: 10px 0; border-radius: 8px; border: 2px solid #2c9118; }
.stats-container { display: flex; justify-content: space-around; flex-wrap: wrap; margin-top: 35px; }
.stat-card { background: #000; color: #fff; padding: 20px; border-radius: 12px; min-width: 150px; margin: 10px; }
.stat-card p { color: #2c9118; font-size: 1.5rem; font-weight: bold; margin: 5px 0 0; }
footer { text-align: center; padding: 20px; background: #000; color: #fff; margin-top: 30px; }
label { display: block; margin-top: 15px; font-weight: bold; font-size: 1rem; color: #2c9118; }
</style>
</head>
<body>

<header>
<h1 onclick="location.href='index.html'">Tamenomics 2</h1>
<nav>
  <a href="bank.html">Bank</a>
  <a href="jobs.html">Jobs</a>
  <a href="fishing.html">Fishing</a>
  <a href="hunting.html">Hunting</a>
  <a href="shop.html">Shop</a>
  <a href="items.html">Items</a>
  <a href="minigames.html">Mini-Games</a>
</nav>
</header>

<main>
<h2>Jobs</h2>

<label for="job-select">Select a Job:</label>
<select id="job-select">
  <option value="" disabled selected>Choose a job</option>
</select>
<button id="apply-job-btn">Apply for Job</button>

<button id="complete-job-btn">Complete Job</button>

<div class="stats-container">
  <div class="stat-card">
    <h3>Balance</h3>
    <p id="balance-stat">0 Z</p>
  </div>
  <div class="stat-card">
    <h3>Items</h3>
    <p id="items-stat">None</p>
  </div>
</div>
</main>

<footer>&copy; 2025 Arztiser</footer>

<script>
let cash = parseInt(localStorage.getItem('cash')) || 0;
let bank = parseInt(localStorage.getItem('bank')) || 0;
let items = JSON.parse(localStorage.getItem('items')) || [];
let jobs = JSON.parse(localStorage.getItem('jobs')) || [];
let currentJob = localStorage.getItem('currentJob') || null;
let jobTakenToday = localStorage.getItem('jobTakenToday') === 'true';
let jobCompletedToday = localStorage.getItem('jobCompletedToday') === 'true';
let failedJobs = JSON.parse(localStorage.getItem('failedJobs')) || [];

const balanceStat = document.getElementById('balance-stat');
const itemsStat = document.getElementById('items-stat');
const jobSelect = document.getElementById('job-select');
const applyJobBtn = document.getElementById('apply-job-btn');
const completeJobBtn = document.getElementById('complete-job-btn');

const jobList = [
  {name:"Fast Food Worker", stars:1, pay:10, chance:0.95},
  {name:"Taxi Driver", stars:1, pay:10, chance:0.95},
  {name:"Barber", stars:2, pay:25, chance:0.7},
  {name:"Mechanic", stars:2, pay:25, chance:0.7},
  {name:"Artist", stars:3, pay:40, chance:0.5},
  {name:"Musician", stars:3, pay:40, chance:0.5},
  {name:"Computer Programmer", stars:4, pay:75, chance:0.25},
  {name:"Scientist", stars:4, pay:75, chance:0.25},
  {name:"CEO", stars:5, pay:100, chance:0.05},
  {name:"Company Owner", stars:5, pay:100, chance:0.05}
];

function updateStats() {
  balanceStat.textContent = (cash + bank) + ' Z';
  itemsStat.textContent = items.length ? items.join(', ') : 'None';
  renderJobDropdown();

  // Disable complete job button if already completed
  if(jobCompletedToday) {
    completeJobBtn.disabled = true;
    completeJobBtn.style.background = '#aaa';
    completeJobBtn.style.cursor = 'not-allowed';
  } else {
    completeJobBtn.disabled = false;
    completeJobBtn.style.background = '#2c9118';
    completeJobBtn.style.cursor = 'pointer';
  }

  localStorage.setItem('cash', cash);
  localStorage.setItem('bank', bank);
  localStorage.setItem('items', JSON.stringify(items));
  localStorage.setItem('currentJob', currentJob);
  localStorage.setItem('jobTakenToday', jobTakenToday);
  localStorage.setItem('jobCompletedToday', jobCompletedToday);
  localStorage.setItem('failedJobs', JSON.stringify(failedJobs));
}

function renderJobDropdown() {
  jobSelect.innerHTML = '<option value="" disabled selected>Choose a job</option>';
  if(currentJob || jobTakenToday) {
    jobSelect.disabled = true;
    applyJobBtn.disabled = true;
    return;
  } else {
    jobSelect.disabled = false;
    applyJobBtn.disabled = false;
  }

  jobList.forEach(job => {
    if(!failedJobs.includes(job.name)) {
      const opt = document.createElement('option');
      opt.value = job.name;
      opt.textContent = `${job.name} (${job.stars}★)`;
      jobSelect.appendChild(opt);
    }
  });
}

applyJobBtn.addEventListener('click', () => {
  const selectedJobName = jobSelect.value;
  if(!selectedJobName) return alert("Please select a job!");
  const job = jobList.find(j => j.name === selectedJobName);

  if(Math.random() <= job.chance) {
    currentJob = job.name;
    cash += job.pay;
    jobs.push(currentJob);
    jobTakenToday = true;
    alert(`Success! You got the job: ${job.name} and earned ${job.pay} Z.`);
  } else {
    failedJobs.push(job.name);
    alert(`You were denied for ${job.name}. Try another job!`);
  }
  updateStats();
});

completeJobBtn.addEventListener('click', () => {
  if(jobCompletedToday) { alert("You already completed a job today."); return; }
  if(!currentJob) { alert("No current job to complete!"); return; }

  let job = jobList.find(j => j.name === currentJob);
  cash += job ? job.pay : 0;
  alert(`Job completed! You earned ${job ? job.pay : 0} Z.`);
  currentJob = null;
  jobCompletedToday = true;
  updateStats();
});

updateStats();
</script>

</body>
</html>
