<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c9118" />
  <meta name="description" content="Casino - Tamenomics Discord Bot Economy" />
  <title>Casino - Tamenomics</title>
  <link rel="icon" href="./img/pfp.png" />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #2c9118;
    }
    header {
      background-color: #2c9118;
      padding: 12px 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      cursor: pointer;
    }
    .menu-icon {
      font-size: 30px;
      cursor: pointer;
    }
    .topnav-right {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      background-color: #2c9118;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      z-index: 999;
      overflow-y: auto;
    }
    .topnav.active .topnav-right {
      display: flex;
    }
    body.menu-open {
      overflow: hidden;
    }
    .accordion-toggle {
      background: none;
      color: white;
      padding: 14px;
      text-align: left;
      font-size: 24px;
      border: none;
      outline: none;
      cursor: pointer;
      width: 100%;
    }
    .accordion-content {
      display: none;
      flex-direction: column;
      background-color: #1e6f12;
    }
    .accordion-content a {
      padding: 12px 28px;
      border-top: 1px solid #146f0e;
      font-size: 20px;
      color: white;
      text-decoration: none;
    }
    .accordion-content a:hover {
      background: #146f0e;
    }
    .accordion-section {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #1e6f12;
    }
    .accordion-section.open .accordion-content {
      display: flex;
    }
    main {
      max-width: 600px;
      margin: 24px auto;
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 10px rgba(44, 145, 24, 0.3);
    }
    h2 {
      font-size: 32px;
      margin-bottom: 16px;
    }
    .game {
      margin-bottom: 32px;
    }
    .game input, .game button, .game select {
      font-family: 'Jersey 10', sans-serif;
      font-size: 20px;
      padding: 8px 12px;
      margin: 8px 0;
      width: 100%;
      box-sizing: border-box;
    }
    .result {
      font-size: 22px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1 onclick="location.href='/'">Tamenomics</h1>
    <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
    <nav class="topnav-right">
      <div class="accordion-section">
        <button class="accordion-toggle">Actions</button>
        <div class="accordion-content">
          <a href="hunt.html">Hunt</a>
          <a href="fish.html">Fish</a>
          <a href="crime.html">Crime</a>
          <a href="search.html">Search</a>
        </div>
      </div>
      <div class="accordion-section">
        <button class="accordion-toggle">Economy</button>
        <div class="accordion-content">
          <a href="bank.html">Bank</a>
          <a href="casino.html" class="active">Casino</a>
          <a href="jobs.html">Jobs</a>
          <a href="shop.html">Shop</a>
          <a href="sell.html">Sell</a>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <h2>Casino</h2>
    <div class="game">
      <h3>Roulette (Red or Black)</h3>
      <input type="number" id="roulette-bet" placeholder="Enter Bet (Min 2500)" />
      <select id="roulette-choice">
        <option value="red">Red</option>
        <option value="black">Black</option>
      </select>
      <button onclick="playRoulette()">Spin</button>
      <div class="result" id="roulette-result"></div>
    </div><div class="game">
  <h3>Simple 50/50 Bet</h3>
  <input type="number" id="simple-bet" placeholder="Enter Bet (Min 2500)" />
  <button onclick="playSimple()">Bet</button>
  <div class="result" id="simple-result"></div>
</div>

  </main>  <script>
    let cash = parseInt(localStorage.getItem("cash")) || 0;

    function playRoulette() {
      const bet = parseInt(document.getElementById('roulette-bet').value);
      const choice = document.getElementById('roulette-choice').value;
      const result = document.getElementById('roulette-result');

      if (bet < 2500 || bet > cash) return result.textContent = "Invalid Bet.";

      const win = Math.random() < 0.5 ? 'red' : 'black';
      if (choice === win) {
        cash += bet;
        result.textContent = `You Win! It Was ${win.charAt(0).toUpperCase() + win.slice(1)}.`;
      } else {
        cash -= bet;
        result.textContent = `You Lost. It Was ${win.charAt(0).toUpperCase() + win.slice(1)}.`;
      }
      localStorage.setItem("cash", cash);
    }

    function playSimple() {
      const bet = parseInt(document.getElementById('simple-bet').value);
      const result = document.getElementById('simple-result');

      if (bet < 2500 || bet > cash) return result.textContent = "Invalid Bet.";

      if (Math.random() < 0.5) {
        cash += bet;
        result.textContent = "You Win!";
      } else {
        cash -= bet;
        result.textContent = "You Lost.";
      }
      localStorage.setItem("cash", cash);
    }

    function toggleMenu() {
      document.querySelector('header').classList.toggle('active');
      document.querySelector('.topnav-right').classList.toggle('active');
      document.body.classList.toggle('menu-open');
    }

    document.querySelectorAll('.accordion-toggle').forEach(btn =>
      btn.addEventListener('click', () => {
        const section = btn.parentElement;
        document.querySelectorAll('.accordion-section').forEach(s => {
          if (s !== section) s.classList.remove('open');
        });
        section.classList.toggle('open');
      })
    );
  </script></body>
</html>
