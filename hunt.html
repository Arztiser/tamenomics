<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2c9118" />
<meta name="description" content="Go Hunting And Catch Animals In Tamenomics." />
<title>Hunt - Tamenomics</title>
<link rel="icon" href="./img/pfp.png" />
<link rel="stylesheet" href="https://therandoms.pages.dev/css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Jersey 10', sans-serif;
    font-size: 30px;
    margin: 0; padding: 0;
    background: #f5f5f5;
    color: #2c9118;
    text-align: center;
  }
  header {
    background: #2c9118;
    color: white;
    padding: 15px 0;
  }
  main {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 6px 15px rgb(44 145 24 / 0.3);
  }
  select, button {
    font-family: 'Jersey 10', sans-serif;
    font-size: 24px;
    padding: 12px 15px;
    border-radius: 8px;
    border: 2px solid #2c9118;
    margin: 15px 0;
    cursor: pointer;
  }
  button {
    background-color: #2c9118;
    color: white;
    font-weight: 700;
    width: 100%;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #237b14;
  }
  .result {
    margin-top: 30px;
    font-size: 26px;
    font-weight: 700;
    min-height: 40px;
    color: #2c9118;
  }
  nav {
    margin-top: 30px;
  }
  nav a {
    color: #2c9118;
    font-weight: 700;
    margin: 0 12px;
    text-decoration: none;
  }
  nav a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<header>
  <h1>Hunt - Tamenomics</h1>
</header>
<main>
  <label for="location-select">Choose Location:</label><br />
  <select id="location-select">
    <option value="forest">Forest</option>
    <option value="plains">Plains</option>
    <option value="mountains">Mountains</option>
  </select>
  <button id="hunt-btn">Hunt!</button>
  <div class="result" id="result"></div>

  <nav>
    <a href="index.html">Home</a> |
    <a href="bank.html">Bank</a> |
    <a href="fish.html">Fish</a> |
    <a href="inventory.html">Inventory</a> |
    <a href="shop.html">Shop</a>
  </nav>
</main>

<script>
  let inventory = JSON.parse(localStorage.getItem('inventory')) || {};

  const animalsByLocation = {
    forest: ['Deer', 'Rabbit', 'Fox', 'Bear'],
    plains: ['Bison', 'Rabbit', 'Wolf', 'Coyote'],
    mountains: ['Mountain Goat', 'Eagle', 'Bear', 'Cougar']
  };

  const locationSelect = document.getElementById('location-select');
  const resultDiv = document.getElementById('result');
  const huntBtn = document.getElementById('hunt-btn');

  function addToInventory(item) {
    inventory[item] = (inventory[item] || 0) + 1;
    localStorage.setItem('inventory', JSON.stringify(inventory));
  }

  huntBtn.onclick = () => {
    const location = locationSelect.value;
    const animals = animalsByLocation[location];
    const caught = animals[Math.floor(Math.random() * animals.length)];
    addToInventory(caught);
    resultDiv.textContent = `You Caught A ${caught}!`;
  };
</script>
</body>
</html>
