<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c9118" />
  <meta name="description" content="Hunt Animals - Tamenomics Discord Bot Economy" />
  <title>Hunt - Tamenomics</title>
  <link rel="icon" href="./img/pfp.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #2c9118;
    }
    header {
      background-color: #2c9118;
      padding: 12px 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }
    .menu-icon {
      font-size: 30px;
      cursor: pointer;
      user-select: none;
    }
    .topnav-right {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      background-color: #2c9118;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      z-index: 999;
      overflow-y: auto;
    }
    .topnav.active .topnav-right {
      display: flex;
    }
    body.menu-open {
      overflow: hidden;
    }
    .accordion-toggle {
      background: none;
      color: white;
      padding: 14px;
      text-align: left;
      font-size: 24px;
      border: none;
      outline: none;
      cursor: pointer;
      width: 100%;
      font-family: 'Jersey 10', sans-serif;
      user-select: none;
    }
    .accordion-content {
      display: none;
      flex-direction: column;
      background-color: #1e6f12;
    }
    .accordion-content a {
      padding: 12px 28px;
      border-top: 1px solid #146f0e;
      font-size: 20px;
      color: white;
      text-decoration: none;
      user-select: none;
    }
    .accordion-content a:hover {
      background: #146f0e;
    }
    .accordion-section {
      display: flex;
      flex-direction: column;
      border-top: 1px solid #1e6f12;
    }
    .accordion-section.open .accordion-content {
      display: flex;
    }
    main {
      max-width: 600px;
      margin: 24px auto;
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 10px rgba(44, 145, 24, 0.3);
    }
    h2 {
      font-weight: 700;
      font-size: 32px;
      margin-bottom: 20px;
      color: #2c9118;
      user-select: none;
    }
    label {
      font-weight: 600;
      font-size: 20px;
      display: block;
      margin-bottom: 12px;
      user-select: none;
    }
    select {
      width: 100%;
      font-family: 'Jersey 10', sans-serif;
      font-size: 20px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 2px solid #2c9118;
      margin-bottom: 20px;
    }
    button {
      font-family: 'Jersey 10', sans-serif;
      font-weight: 700;
      font-size: 22px;
      background: #2c9118;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      width: 100%;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #238110;
    }
    .message {
      margin-top: 18px;
      font-size: 20px;
      font-weight: 600;
      min-height: 40px;
      user-select: none;
    }
    .inventory {
      margin-top: 30px;
      font-size: 20px;
      border-top: 2px solid #2c9118;
      padding-top: 12px;
      user-select: none;
    }
    @media (max-width: 640px) {
      main {
        margin: 16px 10px;
        padding: 16px;
      }
      h2 {
        font-size: 26px;
      }
      select, button {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 onclick="location.href='/'">Tamenomics</h1>
    <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
    <nav class="topnav-right">
      <div class="accordion-section">
        <button class="accordion-toggle">Actions</button>
        <div class="accordion-content">
          <a href="hunt.html" class="active">Hunt</a>
          <a href="fish.html">Fish</a>
          <a href="crime.html">Crime</a>
          <a href="search.html">Search</a>
        </div>
      </div>
      <div class="accordion-section">
        <button class="accordion-toggle">Economy</button>
        <div class="accordion-content">
          <a href="bank.html">Bank</a>
          <a href="casino.html">Casino</a>
          <a href="jobs.html">Jobs</a>
          <a href="shop.html">Shop</a>
          <a href="sell.html">Sell</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <h2>Hunt</h2>
    <label for="location-select">Choose Your Location</label>
    <select id="location-select">
      <option value="forest">Forest</option>
      <option value="mountains">Mountains</option>
      <option value="plains">Plains</option>
    </select>

    <button id="hunt-btn">Go Hunt!</button>

    <div class="message" id="message"></div>

    <div class="inventory" id="inventory">
      <h3>Your Inventory</h3>
      <ul id="inventory-list"></ul>
    </div>
  </main>

  <script>
    // Initial user data for demo
    let hasRifle = false; // Should check shop or user data in real app
    let lastHuntTime = 0;
    let inventory = {};

    // Animal lists by location
    const animalsByLocation = {
      forest: ['Deer', 'Rabbit', 'Fox', 'Squirrel'],
      mountains: ['Goat', 'Eagle', 'Bear', 'Mountain Lion'],
      plains: ['Bison', 'Wolf', 'Coyote', 'Prairie Dog'],
    };

    const cooldownMs = 30 * 60 * 1000; // 30 minutes

    const messageEl = document.getElementById('message');
    const inventoryListEl = document.getElementById('inventory-list');
    const huntBtn = document.getElementById('hunt-btn');

    function updateInventoryUI() {
      inventoryListEl.innerHTML = '';
      const keys = Object.keys(inventory);
      if (keys.length === 0) {
        inventoryListEl.innerHTML = '<li>No Animals Yet</li>';
        return;
      }
      keys.forEach(animal => {
        const li = document.createElement('li');
        li.textContent = `${animal} x${inventory[animal]}`;
        inventoryListEl.appendChild(li);
      });
    }

    function canHunt() {
      const now = Date.now();
      if (!hasRifle) {
        messageEl.textContent = "You Need A Rifle To Hunt.";
        return false;
      }
      if (now - lastHuntTime < cooldownMs) {
        const remainingMs = cooldownMs - (now - lastHuntTime);
        const mins = Math.floor(remainingMs / 60000);
        const secs = Math.floor((remainingMs % 60000) / 1000);
        messageEl.textContent = `You Must Wait ${mins}m ${secs}s Before Hunting Again.`;
        return false;
      }
      return true;
    }

    function getRandomAnimal(location) {
      const animals = animalsByLocation[location];
      return animals[Math.floor(Math.random() * animals.length)];
    }

    huntBtn.addEventListener('click', () => {
      if (!canHunt()) return;

      const location = document.getElementById('location-select').value;
      const caught = getRandomAnimal(location);
      inventory[caught] = (inventory[caught] || 0) + 1;
      lastHuntTime = Date.now();

      messageEl.textContent = `You Caught A ${caught} In The ${location.charAt(0).toUpperCase() + location.slice(1)}!`;
      updateInventoryUI();
    });

    updateInventoryUI();

    function toggleMenu() {
      document.querySelector('header').classList.toggle('active');
      document.querySelector('.topnav-right').classList.toggle('active');
      document.body.classList.toggle('menu-open');
    }

    document.querySelectorAll('.accordion-toggle').forEach(btn =>
      btn.addEventListener('click', () => {
        const section = btn.parentElement;
        document.querySelectorAll('.accordion-section').forEach(s => {
          if (s !== section) s.classList.remove('open');
        });
        section.classList.toggle('open');
      })
    );

  </script>
</body>
</html>
