<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c9118" />
  <meta name="description" content="Shop - Tamenomics Discord Bot Economy" />
  <title>Shop - Tamenomics</title>
  <link rel="icon" href="./img/pfp.png" />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Jersey 10', sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #2c9118;
    }
    header {
      background-color: #2c9118;
      padding: 12px 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      cursor: pointer;
    }
    .menu-icon {
      font-size: 30px;
      cursor: pointer;
    }
    .topnav-right {
      display: none;
      position: fixed;
      top: 56px;
      right: 0;
      background-color: #2c9118;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      z-index: 999;
      overflow-y: auto;
    }
    .topnav.active .topnav-right {
      display: flex;
    }
    .accordion-toggle {
      background: none;
      color: white;
      padding: 14px;
      font-size: 24px;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }
    .accordion-content {
      display: none;
      flex-direction: column;
      background-color: #1e6f12;
    }
    .accordion-content a {
      padding: 12px 28px;
      border-top: 1px solid #146f0e;
      font-size: 20px;
      color: white;
      text-decoration: none;
    }
    .accordion-content a:hover {
      background: #146f0e;
    }
    .accordion-section.open .accordion-content {
      display: flex;
    }
    main {
      max-width: 600px;
      margin: 24px auto;
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 10px rgba(44, 145, 24, 0.3);
    }
    h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #ddd;
      padding: 12px 0;
    }
    button {
      font-family: 'Jersey 10', sans-serif;
      font-size: 20px;
      background: #2c9118;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #238110;
    }
    .message {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header>
    <h1 onclick="location.href='/'">Tamenomics</h1>
    <span class="menu-icon" onclick="toggleMenu()">&#9776;</span>
    <nav class="topnav-right">
      <div class="accordion-section">
        <button class="accordion-toggle">Actions</button>
        <div class="accordion-content">
          <a href="hunt.html">Hunt</a>
          <a href="fish.html">Fish</a>
          <a href="crime.html">Crime</a>
          <a href="search.html">Search</a>
        </div>
      </div>
      <div class="accordion-section">
        <button class="accordion-toggle">Economy</button>
        <div class="accordion-content">
          <a href="bank.html">Bank</a>
          <a href="casino.html">Casino</a>
          <a href="jobs.html">Jobs</a>
          <a href="shop.html">Shop</a>
          <a href="sell.html">Sell</a>
        </div>
      </div>
    </nav>
  </header>  <main>
    <h2>Shop</h2>
    <div class="shop-item">
      <span>Rifle - $500</span>
      <button onclick="buyItem('hasRifle', 500)">Buy</button>
    </div>
    <div class="shop-item">
      <span>Fishing Rod - $300</span>
      <button onclick="buyItem('hasRod', 300)">Buy</button>
    </div>
    <div class="message" id="message"></div>
  </main>  <script>
    let user = JSON.parse(localStorage.getItem("tamenomicsUser")) || {
      cash: 0,
      inventory: {},
      hasRifle: false,
      hasRod: false
    };

    function saveUserData() {
      localStorage.setItem("tamenomicsUser", JSON.stringify(user));
    }

    function buyItem(item, cost) {
      const message = document.getElementById("message");
      if (user[item]) {
        message.textContent = "You Already Own This Item.";
        return;
      }
      if (user.cash < cost) {
        message.textContent = "Not Enough Cash.";
        return;
      }
      user.cash -= cost;
      user[item] = true;
      saveUserData();
      message.textContent = "Purchase Successful!";
    }

    function toggleMenu() {
      document.querySelector('header').classList.toggle('active');
      document.querySelector('.topnav-right').classList.toggle('active');
      document.body.classList.toggle('menu-open');
    }

    document.querySelectorAll('.accordion-toggle').forEach(btn =>
      btn.addEventListener('click', () => {
        const section = btn.parentElement;
        document.querySelectorAll('.accordion-section').forEach(s => {
          if (s !== section) s.classList.remove('open');
        });
        section.classList.toggle('open');
      })
    );
  </script></body>
</html>
